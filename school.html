<!doctype html>
<html lang="hi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:28px;
}

h2{
  margin:18px 0 12px;
  font-size:21px;
}

label{
  font-weight:700;
  display:block;
  margin:10px 0 6px;
}

/* SCHOOL SELECT */

.school-box{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  font-size:16px;
  margin-bottom:12px;
}

.school-fixed{
  padding:13px;
  background:#f8fafc;
  border:1px solid #d7dee8;
  border-radius:8px;
  font-weight:700;
  margin-bottom:15px;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #d7dee8;
  border-radius:8px;
  background:#fff;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th,
td{
  border:1px solid #cbd5e1;
  padding:9px;
  vertical-align:middle;
}

th{
  background:#eef3f8;
  text-align:center;
  font-size:15px;
  line-height:1.35;
  white-space:normal;
  word-break:break-word;
  min-width:170px;
}

td{
  background:#fff;
}

td input{
  width:170px;
  min-width:170px;
  height:45px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
  outline:none;
}

td input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

/* REQUIRED */

.required-head::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

.required-input{
  border-color:#dc2626 !important;
}

/* BUTTONS */

.buttons{
  margin-top:14px;
}

.btn{
  padding:11px 17px;
  border:0;
  border-radius:8px;
  margin:4px;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#64748b;
  color:#fff;
}

.btn:hover{
  opacity:.9;
}

/* MESSAGE */

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.hidden{
  display:none !important;
}

.info{
  padding:10px;
  background:#eff6ff;
  color:#1e40af;
  border-radius:8px;
  margin-bottom:12px;
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .school-box{
    font-size:15px;
  }

  .btn{
    margin:4px 2px;
  }

  th{
    min-width:160px;
    font-size:14px;
  }

  td input{
    min-width:160px;
    width:160px;
  }

}

/* PRINT */

@media print{

  .no-print{
    display:none !important;
  }

  html,
  body{
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-wrap{
    overflow:visible !important;
    border:0 !important;
  }

  table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  th,
  td{
    padding:4px !important;
    font-size:9px !important;
    word-break:break-word !important;
  }

  td input{
    min-width:0 !important;
    width:100% !important;
    height:auto !important;
    padding:2px !important;
    border:0 !important;
    font-size:9px !important;
  }

}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>


<!-- SCHOOL SELECT -->

<label>School Name</label>

<select id="school" class="school-box">
  <option value="">-- अपना School Select करें --</option>
</select>


<!-- SELECTED SCHOOL -->

<div id="schoolFixed"
     class="school-fixed hidden">
</div>


<div id="area" class="hidden">

<h2 id="schoolTitle"></h2>


<div class="info">
  नीचे Admin में बनाए गए Columns के अनुसार जानकारी भरें।
  <span id="requiredInfo"></span>
</div>


<!-- TABLE -->

<div class="table-wrap">

<table>

<thead id="head"></thead>

<tbody id="body"></tbody>

</table>

</div>


<!-- BUTTONS -->

<div class="buttons no-print">

<button
  id="addRowBtn"
  class="btn blue hidden"
  onclick="addRow()">

  ➕ Add Row

</button>


<button
  class="btn green"
  onclick="submitForm()">

  ☁️ Submit

</button>

</div>


<div id="msg"></div>

</div>

</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =====================================================
   FORM ID
===================================================== */

const formId =
new URLSearchParams(
  window.location.search
).get("form");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let cfg = null;

let rows = [];


/* =====================================================
   SHORT ID
===================================================== */

const $ =
id => document.getElementById(id);


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


/* =====================================================
   NORMALIZE COLUMNS

   Admin से columns कभी:
   1. Array of objects
   2. JSON string
   3. Array of strings

   किसी भी format को यहाँ सही करेंगे।
===================================================== */

function normalizeColumns(columns){

  if(typeof columns === "string"){

    try{

      columns =
        JSON.parse(columns);

    }
    catch(e){

      columns =
        columns
          .split("\n")
          .map(x => x.trim())
          .filter(Boolean);

    }

  }


  if(!Array.isArray(columns)){

    return [];

  }


  return columns
    .map(function(c){

      /* पुराना format */

      if(typeof c === "string"){

        return {

          name:c.trim(),

          required:false

        };

      }


      /* नया format */

      return {

        name:String(
          c?.name ?? ""
        ).trim(),

        required:
          Boolean(
            c?.required
          )

      };

    })
    .filter(
      c => c.name
    );

}


/* =====================================================
   NORMALIZE SCHOOLS
===================================================== */

function normalizeSchools(schools){

  if(typeof schools === "string"){

    try{

      schools =
        JSON.parse(schools);

    }
    catch(e){

      schools =
        schools
          .split("\n")
          .map(x => x.trim())
          .filter(Boolean);

    }

  }


  if(!Array.isArray(schools)){

    return [];

  }


  return schools
    .map(x =>
      String(x ?? "").trim()
    )
    .filter(Boolean);

}


/* =====================================================
   API CALL
===================================================== */

async function apiCall(
  action,
  params={}
){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params)
    .forEach(function(k){

      url +=
        "&" +
        encodeURIComponent(k) +
        "=" +
        encodeURIComponent(
          params[k]
        );

    });


  const response =
    await fetch(
      url,
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }
  catch(e){

    console.log(text);

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(
    data &&
    data.ok === false
  ){

    throw new Error(
      data.error ||
      "Google API error"
    );

  }


  return data;

}


/* =====================================================
   LOAD FORM
===================================================== */

async function load(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    if(!formId){

      throw new Error(
        "School link में Form ID नहीं है"
      );

    }


    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(
      !data ||
      !data.ok ||
      !data.form
    ){

      throw new Error(
        data?.error ||
        "Form नहीं मिला"
      );

    }


    /* ==========================================
       FORM CONFIG
    ========================================== */

    cfg = data.form;


    /* ==========================================
       COLUMNS FIX
    ========================================== */

    cfg.columns =
      normalizeColumns(
        cfg.columns
      );


    /* ==========================================
       SCHOOLS FIX
    ========================================== */

    cfg.schools =
      normalizeSchools(
        cfg.schools
      );


    /* ==========================================
       TITLE
    ========================================== */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* ==========================================
       CHECK COLUMNS
    ========================================== */

    if(!cfg.columns.length){

      throw new Error(
        "इस Form में कोई Column नहीं बनाया गया है"
      );

    }


    /* ==========================================
       CHECK SCHOOLS
    ========================================== */

    if(!cfg.schools.length){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    /* ==========================================
       REQUIRED INFO
    ========================================== */

    const requiredColumns =
      cfg.columns
        .filter(c => c.required)
        .map(c => c.name);


    if(requiredColumns.length){

      $("requiredInfo").textContent =
        " Mandatory (*) वाले Columns भरना जरूरी है।";

    }
    else{

      $("requiredInfo").textContent =
        "";

    }


    /* ==========================================
       SCHOOL DROPDOWN
    ========================================== */

    const school =
      $("school");


    school.innerHTML =
      '<option value="">-- अपना School Select करें --</option>' +

      cfg.schools
        .map(function(s){

          return (
            '<option value="' +
            esc(s) +
            '">' +
            esc(s) +
            '</option>'
          );

        })
        .join("");


    /* ==========================================
       SCHOOL CHANGE
    ========================================== */

    school.onchange =
      function(){

        const selected =
          this.value.trim();


        if(!selected){

          $("area")
            .classList
            .add("hidden");

          $("schoolFixed")
            .classList
            .add("hidden");

          return;

        }


        /* Fixed School Name */

        $("schoolFixed")
          .textContent =
          selected;


        $("schoolFixed")
          .classList
          .remove("hidden");


        $("schoolTitle")
          .textContent =
          selected;


        /* ======================================
           START WITH ONE ROW
        ====================================== */

        rows = [

          Array(
            cfg.columns.length
          ).fill("")

        ];


        render();


        /* ======================================
           ADD ROW SETTING
        ====================================== */

        if(
          cfg.allowAddRow === true ||
          cfg.allowAddRow === "true" ||
          cfg.allowAddRow === 1 ||
          cfg.allowAddRow === "1"
        ){

          $("addRowBtn")
            .classList
            .remove("hidden");

        }
        else{

          $("addRowBtn")
            .classList
            .add("hidden");

        }


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    /* ==========================================
       SUCCESS
    ========================================== */

    $("msg").className =
      "msg ok";

    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }
  catch(error){

    console.error(error);

    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render(){

  if(!cfg) return;


  /* ==========================================
     HEADER
  ========================================== */

  let headerHTML =
    "<tr>";


  cfg.columns
    .forEach(function(col){

      headerHTML +=

        '<th class="' +
        (
          col.required
          ? "required-head"
          : ""
        ) +
        '">' +

        esc(col.name) +

        "</th>";

    });


  /* Delete column */

  if(
    cfg.allowAddRow === true ||
    cfg.allowAddRow === "true" ||
    cfg.allowAddRow === 1 ||
    cfg.allowAddRow === "1"
  ){

    headerHTML +=
      '<th class="no-print">Action</th>';

  }


  headerHTML +=
    "</tr>";


  $("head").innerHTML =
    headerHTML;


  /* ==========================================
     BODY
  ========================================== */

  let bodyHTML = "";


  rows.forEach(
    function(row,rowIndex){

      bodyHTML +=
        "<tr>";


      cfg.columns
        .forEach(
          function(col,colIndex){

            const value =
              row[colIndex] ??
              "";


            bodyHTML +=

              "<td>" +

              '<input ' +

              'type="text" ' +

              'value="' +
              esc(value) +
              '" ' +

              (
                col.required
                ? "required"
                : ""
              ) +

              (
                col.required
                ? ' data-required="true"'
                : ""
              ) +

              ' oninput="updateCell(' +
              rowIndex +
              ',' +
              colIndex +
              ',this.value)"' +

              ">" +

              "</td>";

          }
        );


      /* ======================================
         DELETE BUTTON
      ====================================== */

      if(
        cfg.allowAddRow === true ||
        cfg.allowAddRow === "true" ||
        cfg.allowAddRow === 1 ||
        cfg.allowAddRow === "1"
      ){

        bodyHTML +=

          '<td class="no-print">' +

          '<button ' +

          'class="btn red" ' +

          'onclick="delRow(' +
          rowIndex +
          ')"' +

          '>🗑️ Delete</button>' +

          "</td>";

      }


      bodyHTML +=
        "</tr>";

    }
  );


  $("body").innerHTML =
    bodyHTML;

}


/* =====================================================
   UPDATE CELL
===================================================== */

function updateCell(
  rowIndex,
  colIndex,
  value
){

  if(
    !rows[rowIndex]
  ){

    return;

  }


  rows[rowIndex][colIndex] =
    value;

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

  if(!cfg){

    return;

  }


  const allowed =
    (
      cfg.allowAddRow === true ||
      cfg.allowAddRow === "true" ||
      cfg.allowAddRow === 1 ||
      cfg.allowAddRow === "1"
    );


  if(!allowed){

    return;

  }


  rows.push(

    Array(
      cfg.columns.length
    ).fill("")

  );


  render();

}


/* =====================================================
   DELETE ROW
===================================================== */

function delRow(index){

  if(rows.length <= 1){

    rows[0] =
      Array(
        cfg.columns.length
      ).fill("");


    render();

    return;

  }


  rows.splice(
    index,
    1
  );


  render();

}


/* =====================================================
   VALIDATE REQUIRED
===================================================== */

function validateRequired(){

  const errors = [];


  rows.forEach(
    function(row,rowIndex){

      const hasData =
        row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );


      /* पूरी blank row */

      if(!hasData){

        return;

      }


      cfg.columns.forEach(
        function(col,colIndex){

          if(
            col.required &&
            String(
              row[colIndex] ?? ""
            ).trim() === ""
          ){

            errors.push(

              "Row " +
              (rowIndex + 1) +
              " में \"" +
              col.name +
              "\" भरना जरूरी है।"

            );

          }

        }
      );

    }
  );


  return errors;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

  const school =
    $("school").value.trim();


  if(!school){

    alert(
      "पहले School Select करें।"
    );

    return;

  }


  /* ==========================================
     REMOVE COMPLETELY BLANK ROWS
  ========================================== */

  const data =
    rows.filter(
      function(row){

        return row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!data.length){

    alert(
      "कम से कम एक row की information भरें।"
    );

    return;

  }


  /* ==========================================
     REQUIRED VALIDATION
  ========================================== */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  /* ==========================================
     SUBMIT
  ========================================== */

  try{

    $("msg").className =
      "msg loading";


    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    const result =
      await apiCall(
        "submit",
        {

          formId:formId,

          school:school,

          rows:
            JSON.stringify(data)

        }
      );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      result.count +
      " row Google Sheet में save हो गई।";


    /* ======================================
       RESET TO ONE EMPTY ROW
    ====================================== */

    rows = [

      Array(
        cfg.columns.length
      ).fill("")

    ];


    render();


  }
  catch(error){

    console.error(error);

    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =====================================================
   START
===================================================== */

load();

</script>

</body>
</html>
