<!doctype html>
<html lang="hi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#17202a;
}

.wrap{
  width:100%;
  max-width:1200px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:28px;
}

h2{
  margin:18px 0 12px;
  font-size:21px;
}

/* SCHOOL SELECT */

.school-box{
  margin-bottom:15px;
}

.school-box label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.school-select{
  width:100%;
  height:48px;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  font-size:16px;
}

/* SELECTED SCHOOL */

.school-fixed{
  margin-top:10px;
  padding:12px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  font-weight:700;
  color:#1e3a8a;
  word-break:break-word;
}

/* TABLE SCROLL */

.table-scroll{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
}

/* TABLE */

.data-table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
  table-layout:auto;
}

/* CELLS */

.data-table th,
.data-table td{
  border:1px solid #cbd5e1;
  padding:8px;
  vertical-align:middle;
}

/* HEADER */

.data-table th{
  background:#eef3f8;
  color:#17202a;
  font-size:15px;
  font-weight:700;
  text-align:left;
  white-space:normal;
  word-break:break-word;
  min-width:160px;
}

/* REQUIRED STAR */

.data-table th.required::after{
  content:" *";
  color:#dc2626;
  font-size:17px;
}

/* INPUT */

.data-table td input{
  display:block;
  width:180px;
  min-width:180px;
  height:46px;
  padding:8px 10px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:#fff;
  font-size:15px;
  outline:none;
}

.data-table td input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

/* BUTTONS */

.buttons{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  font-size:15px;
  cursor:pointer;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-green{
  background:#15803d;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.btn-gray{
  background:#64748b;
  color:#fff;
}

.btn:hover{
  opacity:.9;
}

/* DELETE COLUMN */

.delete-head{
  min-width:80px !important;
  width:80px;
  text-align:center !important;
}

.delete-cell{
  width:80px;
  min-width:80px;
  text-align:center;
}

.delete-btn{
  border:0;
  background:#dc2626;
  color:#fff;
  border-radius:7px;
  padding:8px 10px;
  cursor:pointer;
  font-size:14px;
}

/* MESSAGE */

.msg{
  margin-top:12px;
  padding:11px;
  border-radius:8px;
  word-break:break-word;
}

.msg-ok{
  background:#ecfdf3;
  color:#166534;
}

.msg-error{
  background:#fef2f2;
  color:#991b1b;
}

.msg-loading{
  background:#eff6ff;
  color:#1d4ed8;
}

/* HIDDEN */

.hidden{
  display:none !important;
}

/* MOBILE */

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:7px;
  }

  .card{
    padding:13px;
    border-radius:10px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .school-select{
    font-size:15px;
  }

  .school-fixed{
    font-size:14px;
  }

  .table-scroll{
    border-radius:7px;
  }

  .data-table th{
    min-width:145px;
    font-size:14px;
  }

  .data-table td input{
    width:160px;
    min-width:160px;
    height:44px;
    font-size:15px;
  }

  .buttons{
    display:flex;
    flex-direction:column;
  }

  .buttons .btn{
    width:100%;
  }

}

/* PRINT */

@media print{

  .no-print{
    display:none !important;
  }

  body{
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-scroll{
    overflow:visible !important;
    border:0 !important;
  }

  .data-table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  .data-table th,
  .data-table td{
    font-size:9px !important;
    padding:3px !important;
    word-break:break-word !important;
  }

  .data-table td input{
    width:100% !important;
    min-width:0 !important;
    height:auto !important;
    border:0 !important;
    padding:2px !important;
    font-size:9px !important;
  }

}

</style>

</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>


<!-- SCHOOL -->

<div class="school-box">

<label for="school">
School Name
</label>

<select
  id="school"
  class="school-select"
>

<option value="">
-- अपना School Select करें --
</option>

</select>

<div
  id="schoolFixed"
  class="school-fixed hidden"
></div>

</div>


<!-- INFORMATION AREA -->

<div
  id="area"
  class="hidden"
>

<h2 id="schoolTitle"></h2>


<!-- TABLE -->

<div class="table-scroll">

<table class="data-table">

<thead id="head"></thead>

<tbody id="body"></tbody>

</table>

</div>


<!-- BUTTONS -->

<div class="buttons no-print">

<button
  id="addRowBtn"
  class="btn btn-blue hidden"
  type="button"
  onclick="addRow()"
>
➕ Add Row
</button>


<button
  class="btn btn-green"
  type="button"
  onclick="submitForm()"
>
☁️ Submit
</button>

</div>


<!-- MESSAGE -->

<div id="msg"></div>

</div>

</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =====================================================
   FORM ID
===================================================== */

const formId =
new URLSearchParams(
  window.location.search
).get("form");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let cfg = null;

let rows = [];


/* =====================================================
   SHORTCUT
===================================================== */

const $ =
id => document.getElementById(id);


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


/* =====================================================
   COLUMN NORMALIZE
=====================================================

   Admin से दो प्रकार का data आ सकता है:

   1. "Teacher Name"

   या

   2. {
        name:"Teacher Name",
        required:true
      }

===================================================== */

function normalizeColumn(column){

  if(
    typeof column === "string"
  ){

    return {

      name:String(column).trim(),

      required:false

    };

  }


  if(
    column &&
    typeof column === "object"
  ){

    return {

      name:String(
        column.name || ""
      ).trim(),

      required:Boolean(
        column.required
      )

    };

  }


  return {

    name:"",

    required:false

  };

}


/* =====================================================
   NORMALIZE ALL COLUMNS
===================================================== */

function getColumns(){

  if(
    !cfg ||
    !Array.isArray(cfg.columns)
  ){

    return [];

  }


  return cfg.columns
    .map(normalizeColumn)
    .filter(c => c.name);

}


/* =====================================================
   API CALL
===================================================== */

async function apiCall(
  action,
  params={}
){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params)
    .forEach(function(key){

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          params[key]
        );

    });


  const response =
    await fetch(
      url,
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }

  catch(e){

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(
    data &&
    data.ok === false
  ){

    throw new Error(
      data.error ||
      "Google API error"
    );

  }


  return data;

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    $("msg");


  box.className =
    "msg " +
    (
      type === "ok"
        ? "msg-ok"
        :
      type === "error"
        ? "msg-error"
        :
      "msg-loading"
    );


  box.textContent =
    text;

}


/* =====================================================
   LOAD FORM
===================================================== */

async function load(){

  showMessage(
    "Form information load हो रही है...",
    "loading"
  );


  try{

    if(!formId){

      throw new Error(
        "Form link में Form ID नहीं है"
      );

    }


    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(
      !data ||
      !data.ok ||
      !data.form
    ){

      throw new Error(
        data?.error ||
        "Form नहीं मिला"
      );

    }


    cfg =
      data.form;


    /* =================================================
       TITLE
    ================================================= */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* =================================================
       SCHOOLS
    ================================================= */

    if(
      !Array.isArray(cfg.schools) ||
      !cfg.schools.length
    ){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    const schoolSelect =
      $("school");


    schoolSelect.innerHTML =
      '<option value="">-- अपना School Select करें --</option>' +

      cfg.schools
        .map(function(s){

          return (
            '<option value="' +
            esc(s) +
            '">' +
            esc(s) +
            '</option>'
          );

        })
        .join("");


    /* =================================================
       SCHOOL CHANGE
    ================================================= */

    schoolSelect.onchange =
      function(){

        const school =
          this.value;


        if(!school){

          $("area")
            .classList
            .add("hidden");

          $("schoolFixed")
            .classList
            .add("hidden");

          return;

        }


        /* SELECTED SCHOOL */

        $("schoolFixed")
          .textContent =
            "Selected School: " +
            school;


        $("schoolFixed")
          .classList
          .remove("hidden");


        $("schoolTitle")
          .textContent =
            school;


        /* =================================================
           CREATE FIRST ROW
        ================================================= */

        const columns =
          getColumns();


        rows = [

          new Array(
            columns.length
          ).fill("")

        ];


        render();


        /* =================================================
           ADD ROW SETTING
        ================================================= */

        const allowAdd =
          cfg.allowAddRow === true ||
          String(
            cfg.allowAddRow
          ).toLowerCase() === "true";


        $("addRowBtn")
          .classList
          .toggle(
            "hidden",
            !allowAdd
          );


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    showMessage(
      "✓ Form और School List load हो गई।",
      "ok"
    );


  }

  catch(error){

    $("title")
      .textContent =
      "Form Load Error";


    showMessage(
      "Error: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render(){

  if(!cfg){

    return;

  }


  const columns =
    getColumns();


  if(!columns.length){

    $("head").innerHTML = "";

    $("body").innerHTML =
      "<tr><td>इस Form में कोई Column नहीं है।</td></tr>";

    return;

  }


  /* ===================================================
     HEADER
  =================================================== */

  let header = "<tr>";


  columns.forEach(
    function(col){

      header +=

        '<th class="' +
        (
          col.required
            ? "required"
            : ""
        ) +
        '">' +

        esc(col.name) +

        "</th>";

    }
  );


  header +=

    '<th class="delete-head no-print">Delete</th>';


  header += "</tr>";


  $("head").innerHTML =
    header;


  /* ===================================================
     BODY
  =================================================== */

  let html = "";


  rows.forEach(
    function(row,rowIndex){

      html += "<tr>";


      columns.forEach(
        function(col,colIndex){

          const value =
            row[colIndex] ?? "";


          html +=

            "<td>" +

            '<input ' +

            'type="text" ' +

            'value="' +
            esc(value) +
            '" ' +

            (
              col.required
                ? "required "
                : ""
            ) +

            'data-row="' +
            rowIndex +
            '" ' +

            'data-col="' +
            colIndex +
            '" ' +

            'oninput="updateCell(this)" ' +

            'placeholder="' +
            esc(col.name) +
            '" ' +

            "/>" +

            "</td>";

        }
      );


      /* DELETE */

      html +=

        '<td class="delete-cell no-print">' +

        '<button ' +

        'type="button" ' +

        'class="delete-btn" ' +

        'onclick="delRow(' +
        rowIndex +
        ')"' +

        '>🗑️</button>' +

        "</td>";


      html += "</tr>";

    }
  );


  $("body").innerHTML =
    html;

}


/* =====================================================
   UPDATE INPUT VALUE
===================================================== */

function updateCell(input){

  const row =
    Number(
      input.dataset.row
    );


  const col =
    Number(
      input.dataset.col
    );


  if(
    rows[row] &&
    rows[row][col] !== undefined
  ){

    rows[row][col] =
      input.value;

  }

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

  if(!cfg){

    return;

  }


  const allowAdd =
    cfg.allowAddRow === true ||
    String(
      cfg.allowAddRow
    ).toLowerCase() === "true";


  if(!allowAdd){

    return;

  }


  const columns =
    getColumns();


  rows.push(

    new Array(
      columns.length
    ).fill("")

  );


  render();

}


/* =====================================================
   DELETE ROW
===================================================== */

function delRow(index){

  if(
    rows.length <= 1
  ){

    const columns =
      getColumns();


    rows[0] =
      new Array(
        columns.length
      ).fill("");


    render();

    return;

  }


  rows.splice(
    index,
    1
  );


  render();

}


/* =====================================================
   VALIDATE MANDATORY
===================================================== */

function validateRequired(){

  const columns =
    getColumns();


  const errors = [];


  rows.forEach(
    function(row,rowIndex){

      /* Empty row */

      const hasData =
        row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );


      if(!hasData){

        return;

      }


      columns.forEach(
        function(col,colIndex){

          if(
            col.required &&
            String(
              row[colIndex] ?? ""
            ).trim() === ""
          ){

            errors.push(

              "Row " +
              (rowIndex + 1) +
              " में '" +
              col.name +
              "' भरना जरूरी है"

            );

          }

        }
      );

    }
  );


  return errors;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

  const school =
    $("school").value;


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /* REMOVE COMPLETELY EMPTY ROWS */

  const data =
    rows.filter(
      function(row){

        return row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!data.length){

    alert(
      "कम से कम एक row में information भरें"
    );

    return;

  }


  /* MANDATORY CHECK */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    showMessage(
      "Google Sheet में save हो रहा है...",
      "loading"
    );


    const result =
      await apiCall(
        "submit",
        {

          formId:formId,

          school:school,

          rows:
            JSON.stringify(data)

        }
      );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    showMessage(

      "✓ " +
      result.count +
      " row Google Sheet में save हो गई।",

      "ok"

    );


    /* RESET */

    const columns =
      getColumns();


    rows = [

      new Array(
        columns.length
      ).fill("")

    ];


    render();


  }

  catch(error){

    showMessage(

      "Error: " +
      error.message,

      "error"

    );

  }

}


/* =====================================================
   START
===================================================== */

load();

</script>

</body>
</html>
