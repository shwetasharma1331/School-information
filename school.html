<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:26px;
}

h2{
  margin:15px 0;
  font-size:21px;
}

label{
  font-weight:700;
  display:block;
  margin:10px 0 6px;
}

.school-fixed{
  width:100%;
  padding:12px;
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-weight:700;
  min-height:45px;
}

select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

.hidden{
  display:none!important;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  margin-top:10px;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th,
td{
  border:1px solid #cbd5e1;
  padding:8px;
  vertical-align:middle;
}

th{
  background:#eef3f8;
  text-align:center;
  font-size:15px;
  min-width:170px;
  white-space:normal;
  word-break:break-word;
}

td{
  background:#fff;
}

td input{
  width:160px;
  min-width:160px;
  height:45px;
  padding:8px 10px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

.required-head::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

.delete-col{
  min-width:80px;
  width:80px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#64748b;
  color:#fff;
}

/* =========================
   MESSAGE
========================= */

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.info{
  background:#eff6ff;
  color:#1e40af;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .btn{
    width:100%;
    margin:5px 0;
  }

  th{
    min-width:160px;
  }

  td input{
    min-width:150px;
    width:150px;
  }
}

/* =========================
   PRINT
========================= */

@media print{

  .no-print{
    display:none!important;
  }

  html,
  body{
    margin:0!important;
    padding:0!important;
    background:#fff!important;
  }

  .wrap,
  .card{
    width:100%!important;
    max-width:none!important;
    margin:0!important;
    padding:0!important;
    box-shadow:none!important;
  }

  .table-wrap{
    overflow:visible!important;
    border:0!important;
  }

  table{
    width:100%!important;
    min-width:0!important;
    table-layout:fixed!important;
  }

  th,
  td{
    padding:3px!important;
    font-size:8px!important;
  }

  td input{
    width:100%!important;
    min-width:0!important;
    height:auto!important;
    padding:2px!important;
    border:0!important;
    font-size:8px!important;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>

<label>School Name</label>

<div id="schoolFixed" class="school-fixed">
  School list load हो रही है...
</div>

<select id="school" class="hidden">
</select>

<div id="area" class="hidden">

  <h2 id="schoolTitle"></h2>

  <div class="info">
    नीचे Admin में बनाए गए Columns के अनुसार जानकारी भरें।
  </div>

  <div class="table-wrap">

    <table>

      <thead id="head"></thead>

      <tbody id="body"></tbody>

    </table>

  </div>

  <div class="no-print">

    <button
      id="addRowBtn"
      class="btn blue hidden"
      onclick="addRow()">
      ➕ Add Row
    </button>

    <button
      class="btn green"
      onclick="submitForm()">
      ☁️ Submit
    </button>

  </div>

  <div id="msg"></div>

</div>

</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


const formId =
new URLSearchParams(
  window.location.search
).get("form");


let cfg = null;

let rows = [];


/* =====================================================
   SHORTCUT
===================================================== */

const $ = id =>
document.getElementById(id);


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


/* =====================================================
   MESSAGE
===================================================== */

function showMsg(text,type){

  const box = $("msg");

  box.className =
    "msg " + (type || "");

  box.textContent = text;

}


/* =====================================================
   API CALL
===================================================== */

async function apiCall(action,params={}){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);

  Object.keys(params).forEach(function(k){

    url +=
      "&" +
      encodeURIComponent(k) +
      "=" +
      encodeURIComponent(params[k]);

  });


  const response =
    await fetch(url,{
      method:"GET",
      redirect:"follow",
      cache:"no-store"
    });


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }

  catch(e){

    console.log(text);

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(data && data.ok === false){

    throw new Error(
      data.error ||
      "Google API Error"
    );

  }


  return data;

}


/* =====================================================
   IMPORTANT:
   ADMIN COLUMNS NORMALIZE
===================================================== */

function normalizeColumns(raw){

  let columns = raw;


  /*
    Case 1:
    Admin से JSON string आ गई
  */

  if(typeof columns === "string"){

    const text =
      columns.trim();


    if(
      text.startsWith("[") &&
      text.endsWith("]")
    ){

      try{

        columns =
          JSON.parse(text);

      }

      catch(e){

        console.log(
          "Column JSON parse error",
          e
        );

      }

    }

  }


  /*
    Case 2:
    JSON के अंदर फिर JSON string
  */

  if(typeof columns === "string"){

    try{

      const second =
        JSON.parse(columns);

      if(Array.isArray(second)){

        columns = second;

      }

    }

    catch(e){}

  }


  if(!Array.isArray(columns)){

    columns = [];

  }


  /*
    हर column को standard object बनाएँ
  */

  return columns
    .map(function(c){

      if(typeof c === "string"){

        /*
          अगर string खुद JSON object है
        */

        const t =
          c.trim();

        if(
          t.startsWith("{") &&
          t.endsWith("}")
        ){

          try{

            const obj =
              JSON.parse(t);

            return {
              name:String(
                obj.name || ""
              ).trim(),

              required:
                obj.required === true ||
                String(
                  obj.required
                ).toLowerCase() === "true"
            };

          }

          catch(e){}

        }


        return {
          name:t,
          required:false
        };

      }


      return {

        name:String(
          c?.name || ""
        ).trim(),

        required:
          c?.required === true ||
          String(
            c?.required
          ).toLowerCase() === "true"

      };

    })

    .filter(function(c){

      return c.name !== "";

    });

}


/* =====================================================
   ADD ROW SETTING NORMALIZE
===================================================== */

function normalizeAddRow(value){

  return (
    value === true ||
    String(value)
      .toLowerCase()
      .trim() === "true"
  );

}


/* =====================================================
   LOAD FORM
===================================================== */

async function load(){

  showMsg(
    "Form information load हो रही है...",
    "loading"
  );


  try{

    if(!formId){

      throw new Error(
        "Form link में Form ID नहीं है"
      );

    }


    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(
      !data.ok ||
      !data.form
    ){

      throw new Error(
        data.error ||
        "Form नहीं मिला"
      );

    }


    cfg =
      data.form;


    /*
      FORM NAME
    */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /*
      COLUMNS FIX
    */

    cfg.columns =
      normalizeColumns(
        cfg.columns
      );


    if(!cfg.columns.length){

      throw new Error(
        "इस Form में कोई Column नहीं मिला"
      );

    }


    /*
      ADD ROW FIX
    */

    cfg.allowAddRow =
      normalizeAddRow(
        cfg.allowAddRow
      );


    /*
      SCHOOL LIST
    */

    if(
      !Array.isArray(
        cfg.schools
      ) ||
      !cfg.schools.length
    ){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    /*
      SCHOOL SELECT
    */

    const school =
      $("school");


    school.innerHTML =
      '<option value="">-- अपना School Select करें --</option>';


    cfg.schools.forEach(
      function(name){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          name;

        option.textContent =
          name;

        school.appendChild(
          option
        );

      }
    );


    /*
      SCHOOL CHANGE
    */

    school.onchange =
      function(){

        const selected =
          this.value.trim();


        if(!selected){

          $("area")
            .classList
            .add("hidden");

          $("schoolFixed")
            .textContent =
            "⬇️ अपना School Select करें";

          return;

        }


        $("schoolFixed")
          .textContent =
          selected;


        $("schoolTitle")
          .textContent =
          selected;


        /*
          पहली row
        */

        rows = [

          new Array(
            cfg.columns.length
          ).fill("")

        ];


        render();


        /*
          ADD ROW BUTTON
        */

        if(cfg.allowAddRow){

          $("addRowBtn")
            .classList
            .remove("hidden");

        }

        else{

          $("addRowBtn")
            .classList
            .add("hidden");

        }


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    /*
      SCHOOL SELECT दिखाएँ
    */

    school.classList.remove(
      "hidden"
    );


    $("schoolFixed")
      .textContent =
      "⬇️ ऊपर अपना School Select करें";


    /*
      SUCCESS
    */

    showMsg(
      "✓ Form और School List load हो गई।",
      "ok"
    );


  }

  catch(e){

    $("title")
      .textContent =
      "Form Load Error";


    showMsg(
      "Error: " + e.message,
      "err"
    );

  }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render(){

  if(!cfg) return;


  /*
    HEADER
  */

  let headHtml =
    "<tr>";


  cfg.columns.forEach(
    function(col){

      headHtml +=
        '<th class="' +
        (
          col.required
          ? "required-head"
          : ""
        ) +
        '">' +
        esc(col.name) +
        "</th>";

    }
  );


  /*
    Delete column केवल Add Row ON होने पर
  */

  if(cfg.allowAddRow){

    headHtml +=
      '<th class="delete-col no-print">Delete</th>';

  }


  headHtml += "</tr>";


  $("head").innerHTML =
    headHtml;


  /*
    BODY
  */

  let bodyHtml = "";


  rows.forEach(
    function(row,rowIndex){

      bodyHtml += "<tr>";


      cfg.columns.forEach(
        function(col,colIndex){

          const value =
            row[colIndex] ?? "";


          bodyHtml +=
            "<td>" +

            '<input ' +
            'type="text" ' +

            'value="' +
            esc(value) +
            '" ' +

            (
              col.required
              ? "required "
              : ""
            ) +

            'placeholder="' +
            esc(col.name) +
            '" ' +

            'oninput="updateCell(' +
            rowIndex +
            "," +
            colIndex +
            ',this.value)">' +

            "</td>";

        }
      );


      /*
        Delete button
      */

      if(cfg.allowAddRow){

        bodyHtml +=
          '<td class="no-print">' +

          '<button ' +
          'class="btn red" ' +
          'onclick="delRow(' +
          rowIndex +
          ')">' +

          "🗑️" +

          "</button>" +

          "</td>";

      }


      bodyHtml +=
        "</tr>";

    }
  );


  $("body").innerHTML =
    bodyHtml;

}


/* =====================================================
   UPDATE CELL
===================================================== */

function updateCell(
  rowIndex,
  colIndex,
  value
){

  if(
    rows[rowIndex]
  ){

    rows[rowIndex][colIndex] =
      value;

  }

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

  if(
    !cfg ||
    !cfg.allowAddRow
  ){

    return;

  }


  rows.push(

    new Array(
      cfg.columns.length
    ).fill("")

  );


  render();

}


/* =====================================================
   DELETE ROW
===================================================== */

function delRow(index){

  if(
    !cfg ||
    !cfg.allowAddRow
  ){

    return;

  }


  if(rows.length > 1){

    rows.splice(
      index,
      1
    );

  }

  else{

    rows[0] =
      new Array(
        cfg.columns.length
      ).fill("");

  }


  render();

}


/* =====================================================
   VALIDATE MANDATORY
===================================================== */

function validateRequired(){

  const errors = [];


  rows.forEach(
    function(row,rowIndex){

      const hasAny =
        row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );


      /*
        पूरी blank row को skip
      */

      if(!hasAny){

        return;

      }


      cfg.columns.forEach(
        function(col,colIndex){

          if(
            col.required &&
            String(
              row[colIndex] ?? ""
            ).trim() === ""
          ){

            errors.push(
              "Row " +
              (rowIndex + 1) +
              " में '" +
              col.name +
              "' भरना जरूरी है"
            );

          }

        }
      );

    }
  );


  return errors;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

  const school =
    $("school")
      .value
      .trim();


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /*
    Blank rows remove
  */

  const data =
    rows.filter(
      function(row){

        return row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!data.length){

    alert(
      "कम से कम एक row भरें"
    );

    return;

  }


  /*
    Mandatory check
  */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    showMsg(
      "Google Sheet में save हो रहा है...",
      "loading"
    );


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,

          school:school,

          rows:
            JSON.stringify(data)
        }
      );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    showMsg(
      "✓ " +
      result.count +
      " row Google Sheet में save हो गई।",
      "ok"
    );


    /*
      Submit के बाद खाली row
    */

    rows = [

      new Array(
        cfg.columns.length
      ).fill("")

    ];


    render();


  }

  catch(e){

    showMsg(
      "Error: " +
      e.message,
      "err"
    );

  }

}


/* =====================================================
   START
===================================================== */

load();

</script>

</body>
</html>
