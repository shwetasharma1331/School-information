<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#17202a;
}

.wrap{
  max-width:1150px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:27px;
}

h2{
  margin:18px 0 12px;
  font-size:20px;
}

label{
  display:block;
  font-weight:700;
  margin:10px 0 6px;
}

select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  background:#fff;
}

.school-fixed{
  margin-top:10px;
  padding:12px;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  border-radius:8px;
  font-weight:bold;
  color:#1e3a8a;
}

/* ================= TABLE ================= */

.table-box{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #cbd5e1;
  border-radius:8px;
  -webkit-overflow-scrolling:touch;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th{
  border:1px solid #cbd5e1;
  background:#eef3f8;
  padding:10px;
  min-width:170px;
  text-align:left;
  font-size:15px;
  white-space:normal;
  word-break:break-word;
}

td{
  border:1px solid #cbd5e1;
  padding:7px;
  min-width:170px;
  background:#fff;
}

td input{
  width:100%;
  min-width:150px;
  height:46px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

td input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

.required-head::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

/* ================= BUTTON ================= */

.btn{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.hidden{
  display:none !important;
}

/* ================= MESSAGE ================= */

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  th,
  td{
    min-width:160px;
  }

  td input{
    min-width:145px;
  }

  .btn{
    font-size:14px;
    padding:10px 13px;
  }

}

/* ================= PRINT ================= */

@media print{

  .no-print{
    display:none !important;
  }

  body{
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-box{
    overflow:visible !important;
    border:0 !important;
  }

  table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  th,
  td{
    min-width:0 !important;
    padding:4px !important;
    font-size:9px !important;
  }

  td input{
    min-width:0 !important;
    height:auto !important;
    padding:2px !important;
    border:0 !important;
    font-size:9px !important;
  }

}

</style>

</head>


<body>

<div class="wrap">

<div class="card">

<h1 id="title">
Loading...
</h1>


<label>
School Name
</label>


<select id="school">

<option value="">
-- अपना School Select करें --
</option>

</select>


<div
id="schoolFixed"
class="school-fixed hidden">
</div>


<div
id="area"
class="hidden">


<h2 id="schoolTitle">
</h2>


<div class="table-box">

<table>

<thead id="head">
</thead>

<tbody id="body">
</tbody>

</table>

</div>


<div class="no-print">

<button
id="addRowBtn"
type="button"
class="btn blue hidden"
onclick="addRow()">

➕ Add Row

</button>


<button
id="submitBtn"
type="button"
class="btn green"
onclick="submitForm()">

☁️ Submit

</button>

</div>


<div id="msg"></div>


</div>

</div>

</div>


<script>


/* =====================================================
   APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycby70bOm1aDAkfNwNuOpSA3uZXU2rF5YYKpH1zYIu0J6yiusukebyvmqgmUjdp9n1AQLgg/exec";


/* =====================================================
   FORM ID
===================================================== */

const formId =
new URLSearchParams(
window.location.search
).get("form");


/* =====================================================
   VARIABLES
===================================================== */

let cfg = null;

let rows = [];


/* =====================================================
   ELEMENT
===================================================== */

function $(id){

  return document.getElementById(id);

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


/* =====================================================
   BOOLEAN
===================================================== */

function boolValue(value){

  if(value === true){
    return true;
  }

  if(value === false){
    return false;
  }

  return String(value ?? "")
    .trim()
    .toLowerCase() === "true";

}


/* =====================================================
   NORMALIZE COLUMNS
===================================================== */

function normalizeColumns(columns){

  /*
    Apps Script से normally यह आएगा:

    [
      {
        name:"Teacher Name",
        required:true
      },
      {
        name:"Mobile",
        required:false
      }
    ]
  */


  if(typeof columns === "string"){

    try{

      columns =
        JSON.parse(columns);

    }catch(e){

      return [];

    }

  }


  if(!Array.isArray(columns)){

    return [];

  }


  return columns

    .map(function(col){

      /*
        पुराना format:
        "Teacher Name"
      */

      if(typeof col === "string"){

        return {
          name:col.trim(),
          required:false
        };

      }


      /*
        नया format:
        {name:"Teacher Name",required:true}
      */

      if(
        col &&
        typeof col === "object"
      ){

        return {

          name:String(
            col.name || ""
          ).trim(),

          required:boolValue(
            col.required
          )

        };

      }


      return null;

    })

    .filter(function(col){

      return col &&
             col.name;

    });

}


/* =====================================================
   NORMALIZE SCHOOLS
===================================================== */

function normalizeSchools(schools){

  if(!Array.isArray(schools)){

    return [];

  }


  return schools

    .map(function(s){

      return String(
        s ?? ""
      ).trim();

    })

    .filter(Boolean);

}


/* =====================================================
   API CALL
===================================================== */

async function apiCall(
  action,
  params={}
){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params)
    .forEach(function(key){

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          params[key]
        );

    });


  const response =
    await fetch(
      url,
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  const text =
    await response.text();


  console.log(
    "API RESPONSE:",
    text
  );


  let data;

  try{

    data =
      JSON.parse(text);

  }catch(e){

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(
    !data ||
    data.ok === false
  ){

    throw new Error(
      data?.error ||
      "Google API error"
    );

  }


  return data;

}


/* =====================================================
   LOAD FORM
===================================================== */

async function loadForm(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    /* Form ID */

    if(!formId){

      throw new Error(
        "URL में Form ID नहीं है"
      );

    }


    /* API */

    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(
      !data ||
      !data.form
    ){

      throw new Error(
        "Form information नहीं मिली"
      );

    }


    cfg =
      data.form;


    /* =================================================
       FORM NAME
    ================================================= */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* =================================================
       COLUMNS
    ================================================= */

    cfg.columns =
      normalizeColumns(
        cfg.columns
      );


    if(!cfg.columns.length){

      throw new Error(
        "इस Form में कोई Column नहीं मिला"
      );

    }


    /* =================================================
       SCHOOLS
    ================================================= */

    cfg.schools =
      normalizeSchools(
        cfg.schools
      );


    if(!cfg.schools.length){

      throw new Error(
        "इस Form में कोई School नहीं मिला"
      );

    }


    /* =================================================
       ADD ROW
    ================================================= */

    cfg.allowAddRow =
      boolValue(
        cfg.allowAddRow
      );


    console.log(
      "FORM CONFIG:",
      cfg
    );


    /* =================================================
       SCHOOL DROPDOWN
    ================================================= */

    const schoolSelect =
      $("school");


    schoolSelect.innerHTML =
      "";


    const first =
      document.createElement(
        "option"
      );

    first.value = "";

    first.textContent =
      "-- अपना School Select करें --";


    schoolSelect.appendChild(
      first
    );


    cfg.schools.forEach(
      function(schoolName){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          schoolName;

        option.textContent =
          schoolName;

        schoolSelect.appendChild(
          option
        );

      }
    );


    /* =================================================
       SCHOOL CHANGE
    ================================================= */

    schoolSelect.onchange =
      function(){

        const schoolName =
          this.value.trim();


        if(!schoolName){

          $("area")
            .classList
            .add("hidden");

          $("schoolFixed")
            .classList
            .add("hidden");

          return;

        }


        /* Fixed school */

        $("schoolFixed")
          .textContent =
          schoolName;

        $("schoolFixed")
          .classList
          .remove("hidden");


        $("schoolTitle")
          .textContent =
          schoolName;


        /* First row */

        rows = [

          Array(
            cfg.columns.length
          ).fill("")

        ];


        renderTable();


        /* =================================================
           ADD ROW ON/OFF
        ================================================= */

        if(cfg.allowAddRow){

          $("addRowBtn")
            .classList
            .remove("hidden");

        }else{

          $("addRowBtn")
            .classList
            .add("hidden");

        }


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    /* SUCCESS */

    $("msg").className =
      "msg ok";

    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }catch(error){

    console.error(
      "FORM LOAD ERROR:",
      error
    );


    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

  if(!cfg){

    return;

  }


  /* =================================================
     HEADER
  ================================================= */

  let header =
    "<tr>";


  cfg.columns.forEach(
    function(col){

      header +=

        "<th class='" +

        (
          col.required
          ?
          "required-head"
          :
          ""
        ) +

        "'>" +

        esc(col.name) +

        "</th>";

    }
  );


  /* Delete column */

  if(cfg.allowAddRow){

    header +=
      "<th class='no-print'>" +
      "Delete" +
      "</th>";

  }


  header +=
    "</tr>";


  $("head").innerHTML =
    header;


  /* =================================================
     BODY
  ================================================= */

  let body = "";


  rows.forEach(
    function(row,rowIndex){

      body +=
        "<tr>";


      cfg.columns.forEach(
        function(col,colIndex){

          const value =
            row[colIndex] ?? "";


          body +=

            "<td>" +

            "<input " +

            "type='text' " +

            "value='" +
            esc(value) +
            "' " +

            (
              col.required
              ?
              "required "
              :
              ""
            ) +

            "oninput='updateCell(" +
            rowIndex +
            "," +
            colIndex +
            ",this.value)'>" +

            "</td>";

        }
      );


      /* Delete button */

      if(cfg.allowAddRow){

        body +=

          "<td class='no-print'>" +

          "<button " +

          "type='button' " +

          "class='btn red' " +

          "onclick='deleteRow(" +
          rowIndex +
          ")'>" +

          "🗑️ Delete" +

          "</button>" +

          "</td>";

      }


      body +=
        "</tr>";

    }
  );


  $("body").innerHTML =
    body;

}


/* =====================================================
   UPDATE CELL
===================================================== */

function updateCell(
  rowIndex,
  colIndex,
  value
){

  if(!rows[rowIndex]){

    return;

  }


  rows[rowIndex][colIndex] =
    value;

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

  if(!cfg){

    return;

  }


  if(!cfg.allowAddRow){

    return;

  }


  rows.push(

    Array(
      cfg.columns.length
    ).fill("")

  );


  renderTable();

}


/* =====================================================
   DELETE ROW
===================================================== */

function deleteRow(index){

  if(!cfg.allowAddRow){

    return;

  }


  if(rows.length > 1){

    rows.splice(
      index,
      1
    );

  }else{

    rows[0] =
      Array(
        cfg.columns.length
      ).fill("");

  }


  renderTable();

}


/* =====================================================
   MANDATORY VALIDATION
===================================================== */

function validateRequired(){

  const errors = [];


  rows.forEach(
    function(row,rowIndex){

      const hasData =
        row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );


      if(!hasData){

        return;

      }


      cfg.columns.forEach(
        function(col,colIndex){

          if(
            col.required &&
            String(
              row[colIndex] ?? ""
            ).trim() === ""
          ){

            errors.push(

              "Row " +
              (rowIndex + 1) +

              " में '" +
              col.name +
              "' भरना जरूरी है"

            );

          }

        }
      );

    }
  );


  return errors;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

  const school =
    $("school")
      .value
      .trim();


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /* Filled rows only */

  const data =
    rows.filter(
      function(row){

        return row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!data.length){

    alert(
      "कम से कम एक row भरें"
    );

    return;

  }


  /* Mandatory */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    $("msg").className =
      "msg loading";

    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    $("submitBtn").disabled =
      true;


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,

          school:school,

          rows:
            JSON.stringify(data)
        }
      );


    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      (
        result.count ??
        data.length
      ) +
      " row Google Sheet में save हो गई।";


    /* Clear */

    rows = [

      Array(
        cfg.columns.length
      ).fill("")

    ];


    renderTable();


  }catch(error){

    console.error(
      "SUBMIT ERROR:",
      error
    );


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;


  }finally{

    $("submitBtn").disabled =
      false;

  }

}


/* =====================================================
   START
===================================================== */

loadForm();

</script>

</body>
</html>
