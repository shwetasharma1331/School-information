<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7fb;
  color:#17202a;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:27px;
}

h2{
  margin:18px 0 12px;
  font-size:21px;
}

label{
  display:block;
  font-weight:700;
  margin:10px 0 6px;
}

select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  background:white;
}

/* Selected school */
.school-fixed{
  margin-top:10px;
  padding:12px;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  border-radius:8px;
  font-weight:700;
  color:#1e3a8a;
}

/* TABLE SCROLL */
.table-scroll{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #cbd5e1;
  border-radius:8px;
  -webkit-overflow-scrolling:touch;
}

/* Table */
table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th{
  background:#eef3f8;
  border:1px solid #cbd5e1;
  padding:10px;
  min-width:170px;
  text-align:left;
  font-size:15px;
  white-space:normal;
  word-break:break-word;
}

td{
  border:1px solid #cbd5e1;
  padding:7px;
  min-width:170px;
  background:#fff;
}

td input{
  width:100%;
  min-width:150px;
  height:45px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

td input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

/* Mandatory */
.required-head::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

/* Buttons */
.btn{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#64748b;
  color:#fff;
}

.hidden{
  display:none !important;
}

/* Messages */
.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.hint{
  font-size:13px;
  color:#64748b;
  margin:7px 0;
}

/* Mobile */
@media(max-width:650px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .btn{
    font-size:14px;
    padding:10px 13px;
  }

  th,
  td{
    min-width:160px;
  }

  td input{
    min-width:145px;
  }
}

/* Print */
@media print{

  .no-print{
    display:none !important;
  }

  body{
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-scroll{
    overflow:visible !important;
    border:0 !important;
  }

  table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  th,
  td{
    min-width:0 !important;
    padding:4px !important;
    font-size:9px !important;
  }

  td input{
    min-width:0 !important;
    height:auto !important;
    padding:2px !important;
    border:0 !important;
    font-size:9px !important;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>

<label>School Name</label>

<select id="school">
  <option value="">-- अपना School Select करें --</option>
</select>

<div id="schoolFixed" class="school-fixed hidden"></div>

<div id="area" class="hidden">

<h2 id="schoolTitle"></h2>

<div class="hint">
  <span style="color:#dc2626;font-weight:bold">*</span>
  वाले Column की जानकारी भरना अनिवार्य है।
</div>

<div class="table-scroll">

<table>

<thead id="head"></thead>

<tbody id="body"></tbody>

</table>

</div>

<div class="no-print">

<button
  id="addRowBtn"
  type="button"
  class="btn blue hidden"
  onclick="addRow()">
  ➕ Add Row
</button>

<button
  id="submitBtn"
  type="button"
  class="btn green"
  onclick="submitForm()">
  ☁️ Submit
</button>

</div>

<div id="msg"></div>

</div>

</div>

</div>


<script>

/* =========================================================
   APPS SCRIPT API
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =========================================================
   FORM ID
========================================================= */

const formId =
new URLSearchParams(
  window.location.search
).get("form");


/* =========================================================
   GLOBAL
========================================================= */

let cfg = null;

let rows = [];


/* =========================================================
   ELEMENT
========================================================= */

function $(id){

  return document.getElementById(id);

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


/* =========================================================
   JSON PARSER
========================================================= */

function parseJSON(value, fallback){

  if(
    value === null ||
    value === undefined
  ){

    return fallback;

  }


  if(Array.isArray(value)){

    return value;

  }


  if(
    typeof value === "object"
  ){

    return value;

  }


  if(
    typeof value === "string"
  ){

    let text =
      value.trim();


    if(!text){

      return fallback;

    }


    try{

      return JSON.parse(text);

    }catch(e){

      return fallback;

    }

  }


  return fallback;

}


/* =========================================================
   BOOLEAN
========================================================= */

function bool(value){

  if(value === true){

    return true;

  }


  if(value === 1){

    return true;

  }


  const x =
    String(value ?? "")
      .trim()
      .toLowerCase();


  return (
    x === "true" ||
    x === "1" ||
    x === "yes" ||
    x === "on"
  );

}


/* =========================================================
   COLUMNS NORMALIZE
========================================================= */

function normalizeColumns(value){

  let list =
    parseJSON(value,[]);


  if(!Array.isArray(list)){

    return [];

  }


  return list
    .map(function(c){

      /* पुराने format में string */

      if(typeof c === "string"){

        return {
          name:c.trim(),
          required:false
        };

      }


      /* नया Admin format */

      if(
        c &&
        typeof c === "object"
      ){

        return {
          name:String(
            c.name || ""
          ).trim(),

          required:bool(
            c.required
          )
        };

      }


      return null;

    })

    .filter(function(c){

      return c && c.name;

    });

}


/* =========================================================
   SCHOOLS NORMALIZE
========================================================= */

function normalizeSchools(value){

  let list =
    parseJSON(value,[]);


  /* अगर array है */

  if(Array.isArray(list)){

    return list
      .map(function(x){

        if(typeof x === "string"){

          return x.trim();

        }


        if(
          x &&
          typeof x === "object"
        ){

          return String(
            x.name || ""
          ).trim();

        }


        return "";

      })
      .filter(Boolean);

  }


  /* अगर newline string है */

  if(typeof value === "string"){

    return value
      .split(/\r?\n/)
      .map(function(x){

        return x.trim();

      })
      .filter(Boolean);

  }


  return [];

}


/* =========================================================
   API CALL
========================================================= */

async function apiCall(
  action,
  params={}
){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params)
    .forEach(function(key){

      url +=
        "&" +
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          params[key]
        );

    });


  const response =
    await fetch(
      url,
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }catch(e){

    console.log(
      "API RESPONSE:",
      text
    );

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  return data;

}


/* =========================================================
   LOAD FORM
========================================================= */

async function load(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    /* Form ID */

    if(!formId){

      throw new Error(
        "Form link में Form ID नहीं है"
      );

    }


    /* API */

    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    console.log(
      "FORM RESPONSE:",
      data
    );


    if(!data){

      throw new Error(
        "Google API से response नहीं आया"
      );

    }


    if(data.ok === false){

      throw new Error(
        data.error ||
        "Form नहीं मिला"
      );

    }


    if(!data.form){

      throw new Error(
        "Form information नहीं मिली"
      );

    }


    /* =====================================================
       CONFIG
    ===================================================== */

    cfg =
      data.form;


    /* =====================================================
       FORM NAME
    ===================================================== */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* =====================================================
       COLUMNS
    ===================================================== */

    cfg.columns =
      normalizeColumns(
        cfg.columns
      );


    if(
      !cfg.columns ||
      cfg.columns.length === 0
    ){

      throw new Error(
        "Admin में कोई Column नहीं मिला"
      );

    }


    /* =====================================================
       SCHOOL LIST
    ===================================================== */

    cfg.schools =
      normalizeSchools(
        cfg.schools
      );


    if(
      !cfg.schools ||
      cfg.schools.length === 0
    ){

      throw new Error(
        "Admin में कोई School नहीं मिला"
      );

    }


    /* =====================================================
       ADD ROW
    ===================================================== */

    cfg.allowAddRow =
      bool(
        cfg.allowAddRow
      );


    console.log(
      "FINAL CONFIG:",
      cfg
    );


    /* =====================================================
       SCHOOL DROPDOWN
    ===================================================== */

    const select =
      $("school");


    select.innerHTML =
      "";


    const first =
      document.createElement(
        "option"
      );

    first.value = "";

    first.textContent =
      "-- अपना School Select करें --";

    select.appendChild(first);


    cfg.schools.forEach(
      function(schoolName){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          schoolName;

        option.textContent =
          schoolName;

        select.appendChild(
          option
        );

      }
    );


    /* =====================================================
       SCHOOL CHANGE
    ===================================================== */

    select.onchange =
      function(){

        const schoolName =
          this.value.trim();


        if(!schoolName){

          $("area")
            .classList
            .add("hidden");

          $("schoolFixed")
            .classList
            .add("hidden");

          return;

        }


        /* School name */

        $("schoolFixed")
          .textContent =
          schoolName;


        $("schoolFixed")
          .classList
          .remove("hidden");


        $("schoolTitle")
          .textContent =
          schoolName;


        /* First row */

        rows = [
          Array(
            cfg.columns.length
          ).fill("")
        ];


        render();


        /* =================================================
           ADD ROW BUTTON
        ================================================= */

        if(cfg.allowAddRow){

          $("addRowBtn")
            .classList
            .remove("hidden");

        }else{

          $("addRowBtn")
            .classList
            .add("hidden");

        }


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    /* Success */

    $("msg").className =
      "msg ok";

    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  if(!cfg){

    return;

  }


  /* =======================================================
     HEADER
  ======================================================= */

  let header =
    "<tr>";


  cfg.columns.forEach(
    function(col){

      header +=
        "<th class='" +
        (
          col.required
          ? "required-head"
          : ""
        ) +
        "'>" +

        esc(col.name) +

        "</th>";

    }
  );


  /* Delete केवल Add Row ON होने पर */

  if(cfg.allowAddRow){

    header +=
      "<th " +
      "class='no-print' " +
      "style='min-width:100px'>" +
      "Delete" +
      "</th>";

  }


  header +=
    "</tr>";


  $("head").innerHTML =
    header;


  /* =======================================================
     BODY
  ======================================================= */

  let body = "";


  rows.forEach(
    function(row,rowIndex){

      body += "<tr>";


      cfg.columns.forEach(
        function(col,colIndex){

          const value =
            row[colIndex] ?? "";


          body +=
            "<td>" +

            "<input " +

            "type='text' " +

            "value='" +
            esc(value) +
            "' " +

            (
              col.required
              ? "required "
              : ""
            ) +

            "oninput=\"" +
            "updateCell(" +
            rowIndex +
            "," +
            colIndex +
            ",this.value)" +

            ">" +

            "</td>";

        }
      );


      /* Delete */

      if(cfg.allowAddRow){

        body +=
          "<td class='no-print'>" +

          "<button " +
          "type='button' " +
          "class='btn red' " +
          "onclick='delRow(" +
          rowIndex +
          ")'>" +

          "🗑️ Delete" +

          "</button>" +

          "</td>";

      }


      body +=
        "</tr>";

    }
  );


  $("body").innerHTML =
    body;

}


/* =========================================================
   UPDATE CELL
========================================================= */

function updateCell(
  rowIndex,
  colIndex,
  value
){

  if(!rows[rowIndex]){

    return;

  }


  rows[rowIndex][colIndex] =
    value;

}


/* =========================================================
   ADD ROW
========================================================= */

function addRow(){

  if(
    !cfg ||
    !cfg.allowAddRow
  ){

    return;

  }


  rows.push(
    Array(
      cfg.columns.length
    ).fill("")
  );


  render();

}


/* =========================================================
   DELETE ROW
========================================================= */

function delRow(index){

  if(!cfg.allowAddRow){

    return;

  }


  if(rows.length > 1){

    rows.splice(
      index,
      1
    );

  }else{

    rows[0] =
      Array(
        cfg.columns.length
      ).fill("");

  }


  render();

}


/* =========================================================
   VALIDATE MANDATORY
========================================================= */

function validateRequired(){

  const errors = [];


  rows.forEach(
    function(row,rowIndex){

      const hasData =
        row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );


      /* खाली row को skip */

      if(!hasData){

        return;

      }


      cfg.columns.forEach(
        function(col,colIndex){

          if(
            col.required &&
            String(
              row[colIndex] ?? ""
            ).trim() === ""
          ){

            errors.push(
              "Row " +
              (rowIndex + 1) +
              " में '" +
              col.name +
              "' भरना जरूरी है"
            );

          }

        }
      );

    }
  );


  return errors;

}


/* =========================================================
   SUBMIT
========================================================= */

async function submitForm(){

  const school =
    $("school")
      .value
      .trim();


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /* Filled rows */

  const data =
    rows.filter(
      function(row){

        return row.some(
          function(value){

            return String(
              value ?? ""
            ).trim() !== "";

          }
        );

      }
    );


  if(!data.length){

    alert(
      "कम से कम एक row भरें"
    );

    return;

  }


  /* Mandatory */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    $("msg").className =
      "msg loading";

    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    $("submitBtn").disabled =
      true;


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,
          school:school,
          rows:JSON.stringify(data)
        }
      );


    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      (
        result.count ??
        data.length
      ) +
      " row Google Sheet में save हो गई।";


    /* New blank row */

    rows = [
      Array(
        cfg.columns.length
      ).fill("")
    ];


    render();


  }catch(error){

    console.error(
      "SUBMIT ERROR:",
      error
    );


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;


  }finally{

    $("submitBtn").disabled =
      false;

  }

}


/* =========================================================
   START
========================================================= */

load();

</script>

</body>
</html>
