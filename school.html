<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7fb;
  color:#17202a;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:27px;
}

h2{
  margin:18px 0 12px;
  font-size:20px;
}

label{
  display:block;
  font-weight:700;
  margin:10px 0 6px;
}

select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  background:#fff;
}

.school-fixed{
  margin-top:10px;
  padding:12px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  font-weight:700;
  color:#1e3a8a;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #cbd5e1;
  border-radius:8px;
  -webkit-overflow-scrolling:touch;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th{
  background:#eef3f8;
  border:1px solid #cbd5e1;
  padding:10px;
  min-width:170px;
  text-align:left;
  font-size:15px;
  white-space:normal;
  word-break:break-word;
}

td{
  border:1px solid #cbd5e1;
  padding:7px;
  min-width:170px;
  background:#fff;
}

td input{
  width:100%;
  min-width:150px;
  height:45px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

td input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

/* Mandatory */

.required-head::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

/* ================= BUTTON ================= */

.btn{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:white;
}

.green{
  background:#15803d;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.hidden{
  display:none !important;
}

/* ================= MESSAGE ================= */

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
  word-break:break-word;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .btn{
    font-size:14px;
    padding:10px 13px;
  }

  th,
  td{
    min-width:160px;
  }

  td input{
    min-width:145px;
  }
}

/* ================= PRINT ================= */

@media print{

  .no-print{
    display:none !important;
  }

  body{
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-wrap{
    overflow:visible !important;
    border:0 !important;
  }

  table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  th,
  td{
    min-width:0 !important;
    padding:4px !important;
    font-size:9px !important;
  }

  td input{
    min-width:0 !important;
    height:auto !important;
    padding:2px !important;
    border:0 !important;
    font-size:9px !important;
  }
}
</style>
</head>


<body>

<div class="wrap">

<div class="card">

<h1 id="title">
Loading...
</h1>


<label>
School Name
</label>


<select id="school">
<option value="">
-- अपना School Select करें --
</option>
</select>


<div
id="schoolFixed"
class="school-fixed hidden">
</div>


<div
id="area"
class="hidden">


<h2 id="schoolTitle">
</h2>


<div class="table-wrap">

<table>

<thead id="head">
</thead>

<tbody id="body">
</tbody>

</table>

</div>


<div class="no-print">

<button
id="addRowBtn"
class="btn blue hidden"
type="button"
onclick="addRow()">

➕ Add Row

</button>


<button
id="submitBtn"
class="btn green"
type="button"
onclick="submitForm()">

☁️ Submit

</button>

</div>


<div id="msg">
</div>


</div>

</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCk_C_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =====================================================
   FORM ID
===================================================== */

const formId =
new URLSearchParams(
window.location.search
).get("form");


/* =====================================================
   VARIABLES
===================================================== */

let cfg = null;

let rows = [];


/* =====================================================
   ELEMENT
===================================================== */

function $(id){

return document.getElementById(id);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m];

});

}


/* =====================================================
   BOOLEAN
===================================================== */

function toBool(value){

if(value === true){
return true;
}

if(value === false){
return false;
}

const v =
String(value ?? "")
.trim()
.toLowerCase();

return (
v === "true" ||
v === "1" ||
v === "yes" ||
v === "on"
);

}


/* =====================================================
   COLUMNS
===================================================== */

function normalizeColumns(columns){

/*
  Admin से दो तरह का data आ सकता है:

  1.
  ["Teacher Name","Mobile"]

  2.
  [
    {
      name:"Teacher Name",
      required:true
    }
  ]
*/


if(typeof columns === "string"){

try{

columns =
JSON.parse(columns);

}catch(e){

/*
  अगर JSON नहीं है
  तो newline से split
*/

columns =
columns
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

}

}


if(!Array.isArray(columns)){

return [];

}


return columns
.map(function(col){

/* String */

if(typeof col === "string"){

return {

name:col.trim(),

required:false

};

}


/* Object */

if(
col &&
typeof col === "object"
){

return {

name:String(
col.name || ""
).trim(),

required:toBool(
col.required
)

};

}


return null;

})
.filter(function(col){

return col &&
col.name;

});

}


/* =====================================================
   SCHOOLS
===================================================== */

function normalizeSchools(schools){

if(typeof schools === "string"){

try{

const parsed =
JSON.parse(schools);

if(Array.isArray(parsed)){

schools=parsed;

}

}catch(e){

schools =
schools
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

}

}


if(!Array.isArray(schools)){

return [];

}


return schools
.map(function(s){

if(typeof s === "string"){

return s.trim();

}

if(
s &&
typeof s === "object"
){

return String(
s.name || ""
).trim();

}

return "";

})
.filter(Boolean);

}


/* =====================================================
   API CALL
===================================================== */

async function apiCall(
action,
params={}
){

let url =
API +
"?action=" +
encodeURIComponent(action);


Object.keys(params)
.forEach(function(key){

url +=
"&" +
encodeURIComponent(key) +
"=" +
encodeURIComponent(
params[key]
);

});


const response =
await fetch(
url,
{
method:"GET",
redirect:"follow",
cache:"no-store"
}
);


const text =
await response.text();


console.log(
"API RESPONSE:",
text
);


let data;

try{

data =
JSON.parse(text);

}catch(e){

throw new Error(
"Google API का response JSON नहीं है"
);

}


return data;

}


/* =====================================================
   LOAD FORM
===================================================== */

async function load(){

$("msg").className =
"msg loading";

$("msg").textContent =
"Form information load हो रही है...";


try{

if(!formId){

throw new Error(
"Form link में Form ID नहीं है"
);

}


/* API */

const data =
await apiCall(
"getForm",
{
formId:formId
}
);


if(!data){

throw new Error(
"API response खाली है"
);

}


if(data.ok === false){

throw new Error(
data.error ||
"Form नहीं मिला"
);

}


if(!data.form){

throw new Error(
"Form information नहीं मिली"
);

}


cfg =
data.form;


/* =================================================
   FORM NAME
================================================= */

$("title").textContent =
cfg.name ||
"School Information";


/* =================================================
   COLUMNS
================================================= */

cfg.columns =
normalizeColumns(
cfg.columns
);


if(!cfg.columns.length){

throw new Error(
"Admin में कोई Column नहीं मिला"
);

}


/* =================================================
   SCHOOLS
================================================= */

cfg.schools =
normalizeSchools(
cfg.schools
);


if(!cfg.schools.length){

throw new Error(
"Admin में कोई School नहीं मिला"
);

}


/* =================================================
   ADD ROW
================================================= */

cfg.allowAddRow =
toBool(
cfg.allowAddRow
);


/* =================================================
   SCHOOL DROPDOWN
================================================= */

const select =
$("school");


select.innerHTML =
'<option value="">-- अपना School Select करें --</option>';


cfg.schools.forEach(
function(schoolName){

const option =
document.createElement(
"option"
);

option.value =
schoolName;

option.textContent =
schoolName;

select.appendChild(
option
);

});


/* =================================================
   SCHOOL CHANGE
================================================= */

select.onchange =
function(){

const schoolName =
this.value.trim();


if(!schoolName){

$("area")
.classList
.add("hidden");

$("schoolFixed")
.classList
.add("hidden");

return;

}


/* Fixed School */

$("schoolFixed")
.textContent =
schoolName;

$("schoolFixed")
.classList
.remove("hidden");


$("schoolTitle")
.textContent =
schoolName;


/* First Row */

rows = [
Array(
cfg.columns.length
).fill("")
];


render();


/* =================================================
   ADD ROW
================================================= */

if(cfg.allowAddRow){

$("addRowBtn")
.classList
.remove("hidden");

}else{

$("addRowBtn")
.classList
.add("hidden");

}


$("area")
.classList
.remove("hidden");


$("msg").className = "";

$("msg").textContent = "";

};


/* SUCCESS */

$("msg").className =
"msg ok";

$("msg").textContent =
"✓ Form और School List load हो गई।";


}catch(error){

console.error(
error
);

$("title").textContent =
"Form Load Error";

$("msg").className =
"msg err";

$("msg").textContent =
"Error: " +
error.message;

}

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render(){

if(!cfg){

return;

}


/* HEADER */

let header =
"<tr>";


cfg.columns.forEach(
function(col){

header +=
"<th class='" +
(
col.required
?
"required-head"
:
""
) +
"'>" +

esc(col.name) +

"</th>";

});


/* Delete */

if(cfg.allowAddRow){

header +=
"<th class='no-print'>" +
"Delete" +
"</th>";

}


header +=
"</tr>";


$("head").innerHTML =
header;


/* BODY */

let body = "";


rows.forEach(
function(row,rowIndex){

body +=
"<tr>";


cfg.columns.forEach(
function(col,colIndex){

const value =
row[colIndex] ?? "";


body +=
"<td>" +

"<input " +
"type='text' " +

"value='" +
esc(value) +
"' " +

(
col.required
?
"required "
:
""
) +

"oninput='updateCell(" +
rowIndex +
"," +
colIndex +
",this.value)'>" +

"</td>";

});


/* Delete */

if(cfg.allowAddRow){

body +=
"<td class='no-print'>" +

"<button " +
"type='button' " +
"class='btn red' " +

"onclick='delRow(" +
rowIndex +
")'>" +

"🗑️ Delete" +

"</button>" +

"</td>";

}


body +=
"</tr>";

});


$("body").innerHTML =
body;

}


/* =====================================================
   UPDATE CELL
===================================================== */

function updateCell(
row,
col,
value
){

if(!rows[row]){

return;

}

rows[row][col] =
value;

}


/* =====================================================
   ADD ROW
===================================================== */

function addRow(){

if(!cfg){

return;

}

if(!cfg.allowAddRow){

return;

}


rows.push(
Array(
cfg.columns.length
).fill("")
);


render();

}


/* =====================================================
   DELETE ROW
===================================================== */

function delRow(index){

if(!cfg.allowAddRow){

return;

}


if(rows.length > 1){

rows.splice(
index,
1
);

}else{

rows[0] =
Array(
cfg.columns.length
).fill("");

}


render();

}


/* =====================================================
   VALIDATE MANDATORY
===================================================== */

function validateRequired(){

const errors = [];


rows.forEach(
function(row,rowIndex){

const hasData =
row.some(
function(value){

return String(
value ?? ""
).trim() !== "";

});


if(!hasData){

return;

}


cfg.columns.forEach(
function(col,colIndex){

if(
col.required &&
String(
row[colIndex] ?? ""
).trim() === ""
){

errors.push(
"Row " +
(rowIndex + 1) +
" में '" +
col.name +
"' भरना जरूरी है"
);

}

});

});


return errors;

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

const school =
$("school")
.value
.trim();


if(!school){

alert(
"पहले School Select करें"
);

return;

}


/* Filled rows */

const data =
rows.filter(
function(row){

return row.some(
function(value){

return String(
value ?? ""
).trim() !== "";

});

});


if(!data.length){

alert(
"कम से कम एक row भरें"
);

return;

}


/* Mandatory */

const errors =
validateRequired();


if(errors.length){

alert(
"Mandatory information पूरी करें:\n\n" +
errors.join("\n")
);

return;

}


try{

$("msg").className =
"msg loading";

$("msg").textContent =
"Google Sheet में save हो रहा है...";


$("submitBtn").disabled =
true;


const result =
await apiCall(
"submit",
{
formId:formId,
school:school,
rows:JSON.stringify(data)
}
);


if(
!result ||
result.ok === false
){

throw new Error(
result?.error ||
"Save नहीं हुआ"
);

}


$("msg").className =
"msg ok";

$("msg").textContent =
"✓ " +
(
result.count ??
data.length
) +
" row Google Sheet में save हो गई।";


/* Clear */

rows = [
Array(
cfg.columns.length
).fill("")
];


render();


}catch(error){

console.error(
error
);

$("msg").className =
"msg err";

$("msg").textContent =
"Error: " +
error.message;


}finally{

$("submitBtn").disabled =
false;

}

}


/* =====================================================
   START
===================================================== */

load();

</script>

</body>
</html>
