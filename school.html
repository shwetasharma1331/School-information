<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin-top:0;
  font-size:28px;
}

h2{
  font-size:21px;
  margin:14px 0;
}

label{
  font-weight:700;
  display:block;
  margin:10px 0 6px;
}

/* SCHOOL SELECT */

.school-fixed{
  padding:12px;
  background:#f8fafc;
  border:1px solid #d7dee8;
  border-radius:8px;
  font-weight:700;
  margin-bottom:8px;
}

#school{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  margin-top:12px;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th,
td{
  border:1px solid #cbd5e1;
  padding:8px;
  vertical-align:middle;
}

th{
  background:#eef3f8;
  text-align:left;
  font-size:15px;
  line-height:1.3;
  min-width:170px;
  white-space:normal;
  word-break:break-word;
}

td{
  min-width:170px;
  background:#fff;
}

td input{
  width:100%;
  min-width:150px;
  height:45px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
  outline:none;
}

td input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

.required-head::after{
  content:" *";
  color:#dc2626;
}

/* BUTTONS */

.btn{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#64748b;
  color:#fff;
}

/* MESSAGE */

.msg{
  padding:10px;
  margin-top:12px;
  border-radius:8px;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.hidden{
  display:none !important;
}

.info{
  padding:10px;
  background:#eff6ff;
  color:#1e40af;
  border-radius:8px;
  margin:10px 0;
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:18px;
  }

  .btn{
    font-size:14px;
    padding:10px 13px;
  }

  th{
    min-width:150px;
  }

  td{
    min-width:150px;
  }

  td input{
    min-width:130px;
  }
}

/* PRINT */

@media print{

  .no-print{
    display:none !important;
  }

  html,
  body{
    margin:0 !important;
    padding:0 !important;
    background:#fff !important;
  }

  .wrap,
  .card{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    box-shadow:none !important;
  }

  .table-wrap{
    overflow:visible !important;
    border:0 !important;
  }

  table{
    width:100% !important;
    min-width:0 !important;
    table-layout:fixed !important;
  }

  th,
  td{
    padding:3px !important;
    font-size:8px !important;
    word-break:break-word !important;
  }

  td input{
    min-width:0 !important;
    height:auto !important;
    padding:2px !important;
    border:0 !important;
    font-size:8px !important;
  }
}
</style>
</head>


<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>

<label>School Name</label>

<div id="schoolFixed" class="school-fixed">
School select करें
</div>

<select id="school">
  <option value="">-- अपना School Select करें --</option>
</select>


<div id="area" class="hidden">

<h2 id="schoolTitle"></h2>

<div class="info">
Admin में बनाए गए Columns के अनुसार जानकारी भरें।
<span id="mandatoryText"></span>
</div>


<!-- TABLE -->

<div class="table-wrap">

<table>

<thead id="head"></thead>

<tbody id="body"></tbody>

</table>

</div>


<!-- BUTTONS -->

<div class="no-print">

<button
id="addRowBtn"
class="btn blue hidden"
onclick="addRow()">
➕ Add Row
</button>

<button
class="btn green"
onclick="submitForm()">
☁️ Submit
</button>

</div>


<div id="msg"></div>

</div>

</div>

</div>


<script>

/* =========================
   GOOGLE APPS SCRIPT API
========================= */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCk_CkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =========================
   FORM ID
========================= */

const formId =
new URLSearchParams(window.location.search).get("form");


/* =========================
   VARIABLES
========================= */

let cfg = null;
let rows = [];


/* =========================
   GET ELEMENT
========================= */

const $ = id =>
document.getElementById(id);


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


/* =========================
   NORMALIZE COLUMNS
   IMPORTANT FIX
========================= */

function normalizeColumns(columns){

  /*
     Admin से columns कई बार
     JSON STRING के रूप में आता है।

     Example:

     "[{\"name\":\"Teacher Name\",\"required\":true}]"

     इसलिए पहले JSON.parse करेंगे।
  */

  let data = columns;


  /* अगर string है तो parse करो */

  if(typeof data === "string"){

    let temp = data.trim();

    if(!temp){
      return [];
    }

    try{

      data = JSON.parse(temp);

    }catch(e){

      console.error(
        "Columns JSON parse error:",
        e
      );

      return [];

    }

  }


  /*
     कभी-कभी nested JSON आ सकता है।
  */

  if(typeof data === "string"){

    try{

      data = JSON.parse(data);

    }catch(e){

      return [];

    }

  }


  if(!Array.isArray(data)){
    return [];
  }


  /*
     हर column को standard format में बदलना
  */

  return data

    .map(function(c){

      if(typeof c === "string"){

        return {
          name:c.trim(),
          required:false
        };

      }


      return {

        name:String(c?.name || "").trim(),

        required:
          c?.required === true ||
          c?.required === "true" ||
          c?.required === 1 ||
          c?.required === "1"

      };

    })

    .filter(function(c){

      return c.name !== "";

    });

}


/* =========================
   BOOLEAN FIX
========================= */

function toBool(value){

  return (
    value === true ||
    value === "true" ||
    value === "TRUE" ||
    value === 1 ||
    value === "1"
  );

}


/* =========================
   API CALL
========================= */

async function apiCall(action, params={}){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);


  Object.keys(params).forEach(function(k){

    url +=
      "&" +
      encodeURIComponent(k) +
      "=" +
      encodeURIComponent(params[k]);

  });


  const response =
    await fetch(url,{
      method:"GET",
      redirect:"follow",
      cache:"no-store"
    });


  const text =
    await response.text();


  let data;


  try{

    data = JSON.parse(text);

  }catch(e){

    console.log(text);

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(data && data.ok === false){

    throw new Error(
      data.error || "Google API error"
    );

  }


  return data;

}


/* =========================
   LOAD FORM
========================= */

async function load(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    if(!formId){

      throw new Error(
        "Form link में form ID नहीं है"
      );

    }


    /* GET FORM */

    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(
      !data ||
      !data.ok ||
      !data.form
    ){

      throw new Error(
        data?.error ||
        "Form नहीं मिला"
      );

    }


    cfg = data.form;


    /* =====================
       FORM NAME
    ===================== */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* =====================
       COLUMNS FIX
    ===================== */

    cfg.columns =
      normalizeColumns(cfg.columns);


    console.log(
      "FINAL COLUMNS:",
      cfg.columns
    );


    if(!cfg.columns.length){

      throw new Error(
        "Admin Form में कोई Column नहीं मिला।"
      );

    }


    /* =====================
       SCHOOL LIST
    ===================== */

    if(
      !Array.isArray(cfg.schools) ||
      !cfg.schools.length
    ){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    /* =====================
       SCHOOL DROPDOWN
    ===================== */

    const school =
      $("school");


    school.innerHTML =
      '<option value="">-- अपना School Select करें --</option>' +

      cfg.schools
        .map(function(s){

          return (
            '<option value="' +
            esc(s) +
            '">' +
            esc(s) +
            '</option>'
          );

        })
        .join("");


    /* =====================
       ADD ROW SETTING
    ===================== */

    const allowAdd =
      toBool(cfg.allowAddRow);


    console.log(
      "allowAddRow:",
      cfg.allowAddRow,
      "=>",
      allowAdd
    );


    if(allowAdd){

      $("addRowBtn")
        .classList.remove("hidden");

    }else{

      $("addRowBtn")
        .classList.add("hidden");

    }


    /* =====================
       SCHOOL CHANGE
    ===================== */

    school.onchange =
      function(){

        if(!this.value){

          $("area")
            .classList.add("hidden");

          $("schoolFixed")
            .textContent =
            "School select करें";

          return;

        }


        const selected =
          this.value;


        $("schoolFixed")
          .textContent =
          selected;


        $("schoolTitle")
          .textContent =
          selected;


        /*
           First row create
        */

        rows = [

          Array(
            cfg.columns.length
          ).fill("")

        ];


        render();


        /*
           Add Row setting फिर से
           apply करना
        */

        if(toBool(cfg.allowAddRow)){

          $("addRowBtn")
            .classList.remove("hidden");

        }else{

          $("addRowBtn")
            .classList.add("hidden");

        }


        $("area")
          .classList.remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    $("msg").className =
      "msg ok";

    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }catch(e){

    console.error(e);


    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " + e.message;

  }

}


/* =========================
   RENDER TABLE
========================= */

function render(){

  if(!cfg) return;


  /*
     HEAD
  */

  let headHTML = "<tr>";


  cfg.columns.forEach(
    function(c){

      const col =
        typeof c === "string"

        ? {
            name:c,
            required:false
          }

        : c;


      headHTML +=

        '<th class="' +
        (
          col.required
          ? "required-head"
          : ""
        ) +
        '">' +

        esc(col.name) +

        '</th>';

    }
  );


  /*
     Delete column
  */

  headHTML +=
    '<th class="no-print" style="min-width:90px">Delete</th>';


  headHTML += "</tr>";


  $("head").innerHTML =
    headHTML;


  /*
     BODY
  */

  let bodyHTML = "";


  rows.forEach(
    function(row,i){

      bodyHTML += "<tr>";


      cfg.columns.forEach(
        function(c,j){

          const col =
            typeof c === "string"

            ? {
                name:c,
                required:false
              }

            : c;


          const value =
            row[j] || "";


          bodyHTML +=

            "<td>" +

            '<input ' +

            'type="text" ' +

            'value="' +
            esc(value) +
            '" ' +

            (
              col.required
              ? "required"
              : ""
            ) +

            ' placeholder="' +
            esc(col.name) +
            '" ' +

            'oninput="updateCell(' +
            i +
            ',' +
            j +
            ',this.value)"' +

            ">" +

            "</td>";

        }
      );


      bodyHTML +=

        '<td class="no-print">' +

        '<button ' +

        'type="button" ' +

        'class="btn red" ' +

        'onclick="delRow(' +
        i +
        ')"' +

        '>🗑️</button>' +

        '</td>';


      bodyHTML += "</tr>";

    }
  );


  $("body").innerHTML =
    bodyHTML;

}


/* =========================
   UPDATE CELL
========================= */

function updateCell(i,j,value){

  if(!rows[i]) return;

  rows[i][j] = value;

}


/* =========================
   ADD ROW
========================= */

function addRow(){

  if(!cfg) return;


  if(!toBool(cfg.allowAddRow)){

    return;

  }


  rows.push(

    Array(
      cfg.columns.length
    ).fill("")

  );


  render();

}


/* =========================
   DELETE ROW
========================= */

function delRow(i){

  if(rows.length > 1){

    rows.splice(i,1);

  }else{

    rows[0] =
      Array(
        cfg.columns.length
      ).fill("");

  }


  render();

}


/* =========================
   REQUIRED VALIDATION
========================= */

function validateRequired(){

  const errors = [];


  rows.forEach(
    function(row,i){

      /*
         अगर पूरी row खाली है
         तो उसे skip करो
      */

      const hasAny =
        row.some(function(v){

          return String(
            v ?? ""
          ).trim() !== "";

        });


      if(!hasAny){

        return;

      }


      cfg.columns.forEach(
        function(c,j){

          const col =
            typeof c === "string"

            ? {
                name:c,
                required:false
              }

            : c;


          if(
            col.required &&
            String(
              row[j] ?? ""
            ).trim() === ""
          ){

            errors.push(

              "Row " +
              (i+1) +
              " में '" +
              col.name +
              "' भरना जरूरी है"

            );

          }

        }
      );

    }
  );


  return errors;

}


/* =========================
   SUBMIT
========================= */

async function submitForm(){

  const school =
    $("school").value;


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /*
     Empty rows remove
  */

  const data =
    rows.filter(function(row){

      return row.some(
        function(v){

          return String(
            v ?? ""
          ).trim() !== "";

        }
      );

    });


  if(!data.length){

    alert(
      "कम से कम एक row भरें"
    );

    return;

  }


  /*
     Mandatory validation
  */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    $("msg").className =
      "msg loading";


    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,

          school:school,

          rows:JSON.stringify(data)
        }
      );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      (result.count || data.length) +
      " row Google Sheet में save हो गई।";


    /*
       Submit के बाद
       नया blank row
    */

    rows = [

      Array(
        cfg.columns.length
      ).fill("")

    ];


    render();


  }catch(e){

    console.error(e);


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " + e.message;

  }

}


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
