<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Information</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
  color:#17202a;
}

.wrap{
  max-width:1200px;
  margin:20px auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 18px;
  font-size:28px;
}

h2{
  margin:18px 0 12px;
  font-size:21px;
}

label{
  font-weight:700;
  display:block;
  margin:10px 0 6px;
}

/* SCHOOL */

.school-box{
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:12px;
  font-weight:700;
  font-size:16px;
}

select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  background:#fff;
}

/* TABLE */

.table-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid #cbd5e1;
  border-radius:10px;
  margin-top:15px;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th,
td{
  border:1px solid #cbd5e1;
  padding:9px;
  vertical-align:middle;
}

th{
  background:#eef3f8;
  font-size:16px;
  text-align:left;
  white-space:normal;
  word-break:break-word;
  min-width:170px;
}

td{
  background:#fff;
}

td input{
  width:100%;
  min-width:160px;
  height:45px;
  padding:8px 10px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:16px;
}

td input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px #2563eb22;
}

/* REQUIRED */

.required::after{
  content:" *";
  color:#dc2626;
  font-weight:bold;
}

/* BUTTON */

.btn{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  margin:8px 5px 0 0;
  cursor:pointer;
  font-size:15px;
}

.blue{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#64748b;
  color:#fff;
}

.btn:hover{
  opacity:.9;
}

/* MESSAGE */

.msg{
  padding:11px;
  margin-top:12px;
  border-radius:8px;
}

.ok{
  background:#ecfdf3;
  color:#166534;
}

.err{
  background:#fef2f2;
  color:#991b1b;
}

.loading{
  background:#eff6ff;
  color:#1d4ed8;
}

.hidden{
  display:none!important;
}

.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:600px){

  .wrap{
    margin:5px auto;
    padding:8px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  h2{
    font-size:19px;
  }

  th{
    min-width:160px;
    font-size:15px;
  }

  td input{
    min-width:150px;
  }

  .btn{
    width:auto;
  }

}

/* PRINT */

@media print{

  .no-print{
    display:none!important;
  }

  html,
  body{
    margin:0!important;
    padding:0!important;
    background:#fff!important;
  }

  .wrap,
  .card{
    width:100%!important;
    max-width:none!important;
    margin:0!important;
    padding:0!important;
    box-shadow:none!important;
  }

  .table-wrap{
    overflow:visible!important;
    border:0!important;
  }

  table{
    width:100%!important;
    min-width:0!important;
    table-layout:fixed!important;
  }

  th,
  td{
    padding:4px!important;
    font-size:9px!important;
    word-break:break-word!important;
  }

  td input{
    min-width:0!important;
    height:auto!important;
    padding:2px!important;
    border:0!important;
    font-size:9px!important;
  }

}

</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1 id="title">Loading...</h1>

<label>School Name</label>

<div id="schoolBox" class="school-box">
School List Load हो रही है...
</div>

<select id="schoolSelect" class="hidden"></select>

<div id="area" class="hidden">

<h2 id="schoolTitle"></h2>

<div class="info">
Admin में बनाए गए Columns के अनुसार जानकारी भरें।
<span id="rowInfo"></span>
</div>

<div class="table-wrap">

<table>

<thead id="tableHead"></thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<div class="no-print">

<button
  id="addRowBtn"
  class="btn blue hidden"
  type="button"
  onclick="addRow()">
  ➕ Add Row
</button>

<button
  class="btn green"
  type="button"
  onclick="submitForm()">
  ☁️ Submit
</button>

</div>

<div id="msg"></div>

</div>

</div>

</div>


<script>

/* =================================================
   GOOGLE APPS SCRIPT API
================================================= */

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


/* =================================================
   FORM ID
================================================= */

const formId =
new URLSearchParams(window.location.search).get("form");


let cfg = null;

let rows = [];


/* =================================================
   SHORTCUT
================================================= */

const $ = id =>
document.getElementById(id);


/* =================================================
   ESCAPE HTML
================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


/* =================================================
   API CALL
================================================= */

async function apiCall(action,params={}){

  let url =
    API +
    "?action=" +
    encodeURIComponent(action);

  Object.keys(params).forEach(function(key){

    url +=
      "&" +
      encodeURIComponent(key) +
      "=" +
      encodeURIComponent(params[key]);

  });


  const response =
    await fetch(url,{
      method:"GET",
      redirect:"follow",
      cache:"no-store"
    });


  const text =
    await response.text();


  let data;

  try{

    data = JSON.parse(text);

  }
  catch(e){

    console.log(text);

    throw new Error(
      "Google API का response JSON नहीं है"
    );

  }


  if(data && data.ok === false){

    throw new Error(
      data.error || "Google API Error"
    );

  }


  return data;

}


/* =================================================
   COLUMN NORMALIZE
================================================= */

function getColumn(col){

  /*
    पुराने form में column सिर्फ string हो सकता है

    नया form:
    {
      name:"Teacher Name",
      required:true
    }
  */

  if(typeof col === "string"){

    return {
      name:col,
      required:false
    };

  }


  if(col && typeof col === "object"){

    return {
      name:String(col.name || "").trim(),
      required:Boolean(col.required)
    };

  }


  return {
    name:"",
    required:false
  };

}


/* =================================================
   LOAD FORM
================================================= */

async function load(){

  $("msg").className =
    "msg loading";

  $("msg").textContent =
    "Form information load हो रही है...";


  try{

    if(!formId){

      throw new Error(
        "Form link में Form ID नहीं है"
      );

    }


    const data =
      await apiCall(
        "getForm",
        {
          formId:formId
        }
      );


    if(!data.ok || !data.form){

      throw new Error(
        data.error || "Form नहीं मिला"
      );

    }


    cfg = data.form;


    console.log("FORM CONFIG:",cfg);


    /* TITLE */

    $("title").textContent =
      cfg.name ||
      "School Information";


    /* SCHOOL LIST */

    if(
      !Array.isArray(cfg.schools) ||
      cfg.schools.length === 0
    ){

      throw new Error(
        "इस Form में कोई School नहीं है"
      );

    }


    /* SCHOOL SELECT */

    const select =
      $("schoolSelect");


    select.innerHTML =
      '<option value="">-- अपना School Select करें --</option>' +

      cfg.schools.map(function(s){

        return (
          '<option value="' +
          esc(s) +
          '">' +
          esc(s) +
          '</option>'
        );

      }).join("");


    /*
      School change
    */

    select.onchange =
      function(){

        const school =
          this.value.trim();


        if(!school){

          $("area")
            .classList
            .add("hidden");

          return;

        }


        $("schoolBox")
          .textContent =
          school;


        $("schoolTitle")
          .textContent =
          school;


        /*
          हमेशा शुरुआत में 1 row
        */

        rows = [
          Array(
            Array.isArray(cfg.columns)
              ? cfg.columns.length
              : 0
          ).fill("")
        ];


        renderTable();


        /*
          IMPORTANT

          Admin में Add Row ON:
          true / "true" / 1

          तो button दिखेगा
        */

        const allow =
          cfg.allowAddRow === true ||
          cfg.allowAddRow === "true" ||
          cfg.allowAddRow === 1 ||
          cfg.allowAddRow === "1";


        console.log(
          "Add Row Setting:",
          cfg.allowAddRow,
          allow
        );


        $("addRowBtn")
          .classList
          .toggle(
            "hidden",
            !allow
          );


        $("rowInfo").textContent =
          allow
            ? " Add Row उपलब्ध है।"
            : "";


        $("area")
          .classList
          .remove("hidden");


        $("msg").className = "";

        $("msg").textContent = "";

      };


    /*
      School selection दिखाई दे
    */

    select.classList.remove("hidden");


    $("schoolBox").textContent =
      "⬇️ ऊपर अपना School Select करें";


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ Form और School List load हो गई।";


  }
  catch(error){

    console.error(error);


    $("title").textContent =
      "Form Load Error";


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =================================================
   RENDER TABLE
================================================= */

function renderTable(){

  if(!cfg) return;


  if(
    !Array.isArray(cfg.columns) ||
    cfg.columns.length === 0
  ){

    $("tableHead").innerHTML =
      "<tr><th>कोई Column नहीं है</th></tr>";

    $("tableBody").innerHTML = "";

    return;

  }


  /* HEADER */

  let header = "<tr>";


  cfg.columns.forEach(function(column){

    const col =
      getColumn(column);


    header +=
      '<th class="' +
      (
        col.required
          ? "required"
          : ""
      ) +
      '">' +
      esc(col.name) +
      '</th>';

  });


  /*
    Delete column
    केवल Add Row ON होने पर
  */

  const allow =
    cfg.allowAddRow === true ||
    cfg.allowAddRow === "true" ||
    cfg.allowAddRow === 1 ||
    cfg.allowAddRow === "1";


  if(allow){

    header +=
      '<th class="no-print">Delete</th>';

  }


  header += "</tr>";


  $("tableHead").innerHTML =
    header;


  /* BODY */

  let body = "";


  rows.forEach(function(row,rowIndex){

    body += "<tr>";


    cfg.columns.forEach(function(column,colIndex){

      const col =
        getColumn(column);


      const value =
        row[colIndex] ?? "";


      body +=
        '<td>' +

        '<input ' +

        'type="text" ' +

        'value="' +
        esc(value) +
        '" ' +

        (
          col.required
            ? "required"
            : ""
        ) +

        ' placeholder="' +
        esc(col.name) +
        '" ' +

        'oninput="updateValue(' +
        rowIndex +
        ',' +
        colIndex +
        ',this.value)"' +

        '>' +

        '</td>';

    });


    if(allow){

      body +=
        '<td class="no-print">' +

        '<button ' +
        'class="btn red" ' +
        'type="button" ' +
        'onclick="deleteRow(' +
        rowIndex +
        ')">' +

        '🗑️ Delete' +

        '</button>' +

        '</td>';

    }


    body += "</tr>";

  });


  $("tableBody").innerHTML =
    body;

}


/* =================================================
   UPDATE VALUE
================================================= */

function updateValue(row,col,value){

  if(!rows[row]) return;

  rows[row][col] = value;

}


/* =================================================
   ADD ROW
================================================= */

function addRow(){

  if(!cfg) return;


  const allow =
    cfg.allowAddRow === true ||
    cfg.allowAddRow === "true" ||
    cfg.allowAddRow === 1 ||
    cfg.allowAddRow === "1";


  if(!allow){

    alert(
      "इस Form में Add Row बंद है।"
    );

    return;

  }


  rows.push(
    Array(cfg.columns.length)
      .fill("")
  );


  renderTable();

}


/* =================================================
   DELETE ROW
================================================= */

function deleteRow(index){

  if(rows.length <= 1){

    rows[0] =
      Array(cfg.columns.length)
        .fill("");

  }
  else{

    rows.splice(index,1);

  }


  renderTable();

}


/* =================================================
   REQUIRED VALIDATION
================================================= */

function validateRequired(){

  const errors = [];


  rows.forEach(function(row,rowIndex){

    /*
      Completely blank row skip
    */

    const hasData =
      row.some(function(value){

        return String(
          value ?? ""
        ).trim() !== "";

      });


    if(!hasData){

      return;

    }


    cfg.columns.forEach(
      function(column,colIndex){

        const col =
          getColumn(column);


        if(
          col.required &&
          String(
            row[colIndex] ?? ""
          ).trim() === ""
        ){

          errors.push(
            "Row " +
            (rowIndex + 1) +
            " → " +
            col.name +
            " भरना जरूरी है"
          );

        }

      }
    );

  });


  return errors;

}


/* =================================================
   SUBMIT
================================================= */

async function submitForm(){

  const school =
    $("schoolSelect")
      .value
      .trim();


  if(!school){

    alert(
      "पहले School Select करें"
    );

    return;

  }


  /*
    Blank rows हटाएँ
  */

  const data =
    rows.filter(function(row){

      return row.some(function(value){

        return String(
          value ?? ""
        ).trim() !== "";

      });

    });


  if(data.length === 0){

    alert(
      "कम से कम एक row की information भरें"
    );

    return;

  }


  /*
    Mandatory check
  */

  const errors =
    validateRequired();


  if(errors.length){

    alert(
      "Mandatory information पूरी करें:\n\n" +
      errors.join("\n")
    );

    return;

  }


  try{

    $("msg").className =
      "msg loading";


    $("msg").textContent =
      "Google Sheet में save हो रहा है...";


    const result =
      await apiCall(
        "submit",
        {
          formId:formId,

          school:school,

          rows:JSON.stringify(data)
        }
      );


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Save नहीं हुआ"
      );

    }


    $("msg").className =
      "msg ok";


    $("msg").textContent =
      "✓ " +
      (result.count || data.length) +
      " row Google Sheet में save हो गई।";


    /*
      Save के बाद खाली नई row
    */

    rows = [
      Array(cfg.columns.length)
        .fill("")
    ];


    renderTable();


  }
  catch(error){

    console.error(error);


    $("msg").className =
      "msg err";


    $("msg").textContent =
      "Error: " +
      error.message;

  }

}


/* =================================================
   START
================================================= */

load();

</script>

</body>
</html>
