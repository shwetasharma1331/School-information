<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CBEO Bassi School Information System</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #173b75;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    a {
      display: block;
      text-decoration: none;
      padding: 16px;
      margin: 15px 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .school {
      background: #1769aa;
      color: white;
    }

    .admin {
      background: #333;
      color: white;
    }

    .information {
      background: #16a34a;
      color: white;
    }

    a:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }

  </style>
</head>


<body>

  <div class="box">

    <h1>CBEO Bassi School Information System</h1>

    <p>Please select an option</p>


  


    <!-- पुराना Admin Panel -->

    <a
      class="admin"
      href="admin.html">

      🔐 Admin Panel

    </a>


    <!-- नया Information Admin -->

    <a
      class="information"
      href="information-admin.html">

      📋 Information Entry

    </a>


    <div class="footer">

      School Information System

    </div>

  </div>

</body>
</html>
