<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Information Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  margin:0;
}
.wrap{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:14px;
  padding:22px;
  box-shadow:0 3px 15px #0001;
}
label{
  font-weight:700;
  display:block;
  margin:12px 0 6px;
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}
button{
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:12px;
}
button:hover{
  opacity:.9;
}
.msg{
  margin-top:12px;
  padding:11px;
  border-radius:8px;
  word-break:break-word;
}
.ok{
  background:#ecfdf3;
  color:#166534;
}
.err{
  background:#fef2f2;
  color:#991b1b;
}
.link{
  margin-top:10px;
  padding:12px;
  background:#f8fafc;
  border-radius:8px;
  word-break:break-all;
}
.copy{
  background:#16a34a;
  margin-left:8px;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>School Information – Admin</h1>

<label>Admin PIN</label>
<input id="pin" type="password" value="1234">

<label>सूचना का नाम</label>
<input id="name" placeholder="Teacher Information">

<label>Columns – एक line में एक</label>
<textarea id="cols" rows="7"
placeholder="S.No
Teacher Name
Designation
Subject
Mobile Number"></textarea>

<label>Schools – एक line में एक</label>
<textarea id="schools" rows="10"
placeholder="School 1
School 2
School 3"></textarea>

<button onclick="createForm()">➕ Create School Form</button>

<div id="msg"></div>

<div id="result" style="display:none">
  <h3>✅ Form तैयार हो गया</h3>

  <div class="link">
    <b>School Link:</b><br>
    <span id="schoolLink"></span>
  </div>

  <button class="copy" onclick="copyLink()">📋 Copy Link</button>
</div>

</div>
</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbx99czGRhevoQAV38jxIG0uDUfuCkC_KkmKluibPbpwSQPj4592gTJnOtPmBrkDWScIGQ/exec";


function showMsg(text,type){

  const box=document.getElementById("msg");

  box.className="msg "+type;

  box.innerText=text;
}


function createForm(){

  const pin=document.getElementById("pin").value.trim();

  const name=document.getElementById("name").value.trim();

  const cols=document.getElementById("cols").value.trim();

  const schools=document.getElementById("schools").value.trim();


  if(!pin){
    showMsg("Admin PIN डालें","err");
    return;
  }

  if(!name){
    showMsg("सूचना का नाम डालें","err");
    return;
  }

  if(!cols){
    showMsg("Columns डालें","err");
    return;
  }

  if(!schools){
    showMsg("Schools की list डालें","err");
    return;
  }


  showMsg("Form बनाया जा रहा है...","ok");


  fetch(API, {
  method: "POST",
  headers: {
    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
  },
  body: new URLSearchParams({
    action: "createForm",
    pin: pin,
    name: name,
    columns: cols,
    schools: schools
  })
})
  .then(response => response.json())
  .then(data => {

    if(!data.ok){

      showMsg(
        "Error: " + (data.error || "Unknown error"),
        "err"
      );

      return;
    }


    showMsg(
      "Form successfully create हो गया।",
      "ok"
    );


    const formId=data.formId;


    /*
      GitHub Pages का current address automatically लिया जाएगा
      और school.html?form=FORM_ID बनाया जाएगा।
    */

    const base =
      window.location.origin +
      window.location.pathname
        .replace("admin.html","");


    const schoolURL =
      base +
      "school.html?form=" +
      encodeURIComponent(formId);


    document.getElementById("schoolLink").innerText =
      schoolURL;

    document.getElementById("result").style.display =
      "block";

  })
  .catch(error => {

    showMsg(
      "Unable to connect to Google Sheet/API. " +
      error.message,
      "err"
    );

  });

}


function copyLink(){

  const link =
    document.getElementById("schoolLink").innerText;


  navigator.clipboard.writeText(link)
  .then(() => {

    alert("School Link copy हो गया ✅");

  })
  .catch(() => {

    alert("Link copy नहीं हुआ। Manually select करके copy करें।");

  });

}

</script>

</body>
</html>
